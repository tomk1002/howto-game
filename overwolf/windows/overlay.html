<script>
console.log('[OVERLAY] script tag executing — line 1 reached');
window.addEventListener('error', (e) => {
  console.error('[OVERLAY-FATAL]', e.message, 'at', e.filename + ':' + e.lineno + ':' + e.colno);
});
const IS_OW = typeof overwolf !== 'undefined';
console.log('[OVERLAY] IS_OW =', IS_OW);

// ── Overwolf 파일 I/O 퍼시스턴스 ─────────────────────────────────
// STATE_PATH: overwolf.io.paths는 OW 런타임에서만 접근 가능
const STATE_PATH = IS_OW && overwolf.io
  ? `${overwolf.io.paths.localAppData}/combogg/state.json`
  : null;

// Promise 래퍼 — OW 콜백 지옥 방지
function owFileExists(path) {
  return new Promise(resolve => {
    if (!IS_OW || !overwolf.io) { resolve(false); return; }
    overwolf.io.fileExists(path, r => resolve(!!(r && r.found)));
  });
}
function owReadFile(path) {
  return new Promise(resolve => {
    if (!IS_OW || !overwolf.io) { resolve(null); return; }
    overwolf.io.readFileContents(path, overwolf.io.enums.eEncoding.UTF8, r => {
      resolve(r && r.success ? r.content : null);
    });
  });
}
function owWriteFile(path, content) {
  return new Promise(resolve => {
    if (!IS_OW || !overwolf.io) { resolve(false); return; }
    overwolf.io.writeFileContents(path, content, overwolf.io.enums.eEncoding.UTF8, false, r => {
      resolve(!!(r && r.success));
    });
  });
}
function owMkdir(dirPath) {
  return new Promise(resolve => {
    if (!IS_OW || !overwolf.io) { resolve(false); return; }
    // 실제 API: createDirectory (overwolf.io.dir.create는 존재하지 않음).
    // 없는 OW 버전이면 writeFileContents가 자동 생성에 의존.
    if (typeof overwolf.io.createDirectory === 'function') {
      overwolf.io.createDirectory(dirPath, r => resolve(!!(r && r.success)));
    } else {
      resolve(true);
    }
  });
}

// state.json 읽기 → { takes, desktopToken }
async function readStateFile() {
  if (!STATE_PATH) return null;
  try {
    const raw = await owReadFile(STATE_PATH);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) {
    window._dbgPush && window._dbgPush(`[IO] state.json 파싱 오류: ${e?.message || e}`);
    return null;
  }
}

// state.json 쓰기
async function writeStateFile(takes, desktopToken) {
  if (!STATE_PATH) return;
  try {
    // STATE_PATH가 non-null이면 IS_OW && overwolf.io는 이미 보장됨.
    // overwolf.io.paths를 재참조하지 않고 STATE_PATH에서 dir을 도출해 이중 접근 제거.
    const dir = STATE_PATH.substring(0, STATE_PATH.lastIndexOf('/'));
    await owMkdir(dir);
    // videoBytes (Uint8Array)는 JSON 직렬화 대상에서 제외 — 리플레이 캡처는 세션 내에서만 유효
    const serializableTakes = takes.map(({ videoBytes: _v, ...rest }) => rest);
    const content = JSON.stringify({ takes: serializableTakes, desktopToken: desktopToken ?? null }, null, 2);
    const ok = await owWriteFile(STATE_PATH, content);
    if (!ok) window._dbgPush && window._dbgPush('[IO] state.json 저장 실패');
  } catch(e) {
    window._dbgPush && window._dbgPush(`[IO] writeStateFile 오류: ${e?.message || e}`);
  }
}

// Windows Virtual Key 코드 → 키 이름 변환
const VK = {
  // 알파벳 A-Z (65~90)
  65:'A',66:'B',67:'C',68:'D',69:'E',70:'F',71:'G',72:'H',73:'I',74:'J',75:'K',
  76:'L',77:'M',78:'N',79:'O',80:'P',81:'Q',82:'R',83:'S',84:'T',85:'U',
  86:'V',87:'W',88:'X',89:'Y',90:'Z',
  // 숫자 (48~57)
  48:'0',49:'1',50:'2',51:'3',52:'4',53:'5',54:'6',55:'7',56:'8',57:'9',
  // 숫자패드 (96~105)
  96:'0',97:'1',98:'2',99:'3',100:'4',101:'5',102:'6',103:'7',104:'8',105:'9',
  // 펑션키 (112~123)
  112:'F1',113:'F2',114:'F3',115:'F4',116:'F5',117:'F6',
  118:'F7',119:'F8',120:'F9',121:'F10',122:'F11',123:'F12',
  // 특수키
  32:'SPACE',27:'ESC',13:'ENTER',9:'TAB',
  16:'SHIFT',17:'CTRL',18:'ALT',
  192:'`',189:'-',187:'=',219:'[',221:']',220:'\\',186:';',222:"'",188:',',190:'.',191:'/',
};
function vkToKey(code) {
  return VK[code] || String.fromCharCode(code) || String(code);
}

// ── Task 9: LoL game snapshot parser ─────────────────────────
// Overwolf games.events.getInfo() 의 raw 응답을 .tutfile manifest.game_specific 형태로 변환
// 모든 필드는 optional chaining으로 보호 — 누락된 필드는 null/0/[]

// 소환사 주문 ID 추출: Data Dragon은 "SummonerFlash", "SummonerDot" 등 영어 ID를 요구
// Overwolf는 한글 displayName("점화", "점멸")을 주므로 rawDisplayName에서 ID를 파싱
function summonerSpellId(spell) {
  if (!spell) return null;
  if (spell.id && /^Summoner[A-Z]/.test(spell.id)) return spell.id;
  // rawDisplayName: 'GeneratedTip_SummonerSpell_SummonerDot_DisplayName'
  const m = /SummonerSpell_(Summoner[A-Za-z]+)/.exec(spell.rawDisplayName || '');
  if (m) return m[1];
  // 한글 displayName fallback (서버가 매핑 못 할 가능성 있음)
  return spell.displayName || null;
}

function parseLolSnapshot(raw) {
  if (!raw) return null;
  // 헬퍼: 값이 string이면 JSON.parse, 아니면 그대로
  const maybeParse = v => {
    if (typeof v !== 'string') return v;
    try { return JSON.parse(v); } catch { return null; }
  };
  try {
    // TFT(롤체) 큐 가드 — 1090~1160 또는 4xxx대 (TFT/RGM)는 LoL 콤보 데이터로 부적합
    // queueId가 LoL이 아니면 snapshot null로 (콤보는 LoL 전용)
    const queueId = parseInt(raw.game_info?.queueId, 10);
    const TFT_QUEUES = [1090, 1100, 1110, 1130, 1140, 1160, 1150];
    if (Number.isFinite(queueId) && (TFT_QUEUES.includes(queueId) || (queueId >= 1090 && queueId < 1200))) {
      window._dbgPush && window._dbgPush(`[snapshot] TFT 큐 감지(${queueId}) — LoL 콤보 메타로 부적합, skip`);
      return null;
    }

    // live_client_data 자체가 string일 수도 있음
    let lcd = maybeParse(raw.live_client_data);
    if (!lcd) return null;

    // active_player (snake_case) 또는 activePlayer (camelCase) — Overwolf는 snake로 옴
    let ap = lcd.active_player || lcd.activePlayer || {};
    ap = maybeParse(ap) || ap;

    // all_players (배열, 종종 string) — items/summonerSpells의 권위 있는 출처
    let players = lcd.all_players || lcd.allPlayers || [];
    players = maybeParse(players) || players;
    if (!Array.isArray(players)) players = [];

    // 본인 식별: 이름 매칭 → 챔프 매칭 → 첫 번째 fallback
    const summonerName = raw.summoner_info?.name || ap.summonerName || ap.summoner_name;
    const championName = raw.summoner_info?.champion; // e.g. "Nautilus"
    const me = players.find(p => p.summonerName === summonerName)
            || players.find(p => p.summonerName?.startsWith(summonerName))
            || players.find(p => p.rawChampionName?.toLowerCase().includes((championName || '').toLowerCase()))
            || players.find(p => !p.isBot)
            || players[0]
            || {};

    // championStats / abilities는 active_player에만 있음
    const stats = ap.championStats || ap.champion_stats || {};
    const abilities = ap.abilities || {};
    // summoner spells: active_player.summonerSpells 우선, 없으면 me.summonerSpells
    const aps = ap.summonerSpells || ap.summoner_spells || me.summonerSpells || me.summoner_spells || {};

    // 아이템: 본인 me.items가 가장 정확
    const itemList = (Array.isArray(me.items) && me.items.length > 0)
      ? me.items
      : (Array.isArray(ap.items) ? ap.items : []);

    const lvl = ap.level ?? me.level ?? null;
    const lvlNum = lvl !== null ? Number(lvl) : null;

    return {
      required_level: Number.isFinite(lvlNum) ? lvlNum : null,
      ability_haste_min: Number(stats.abilityHaste ?? stats.ability_haste) || null,
      attack_speed_min: Number(stats.attackSpeed ?? stats.attack_speed) || null,
      required_skills: {
        Q: Number(abilities.Q?.abilityLevel ?? abilities.Q?.ability_level) || 0,
        W: Number(abilities.W?.abilityLevel ?? abilities.W?.ability_level) || 0,
        E: Number(abilities.E?.abilityLevel ?? abilities.E?.ability_level) || 0,
        R: Number(abilities.R?.abilityLevel ?? abilities.R?.ability_level) || 0,
      },
      summoner_spells: [
        summonerSpellId(aps.summonerSpellOne || aps.summoner_spell_one),
        summonerSpellId(aps.summonerSpellTwo || aps.summoner_spell_two),
      ].filter(Boolean),
      required_items: itemList
        .map(i => String(i?.itemID ?? i?.item_id ?? i?.id ?? ''))
        .filter(id => id && id !== '0'),
      runes: ap.fullRunes || ap.full_runes || null,
    };
  } catch (e) {
    window._dbgPush && window._dbgPush(`[snapshot] parse error: ${e?.message || e}`);
    return null;
  }
}

const _bus = {};
const _emit = (e,d) => (_bus[e]||[]).forEach(cb=>cb(d));
const _on   = (e,cb) => { (_bus[e]=_bus[e]||[]).push(cb); };

if (!IS_OW) setTimeout(() => _emit('champion', { name:'LeeSin', id:'leesin' }), 1000);

window.OW = {
  onChampion(cb) {
    if (IS_OW) {
      // 인게임 챔피언 감지 (5426)
      overwolf.games.events.onInfoUpdates2.addListener(info => {
        const c = info?.info?.summoner_info?.champion
               || info?.info?.me?.champion;
        if (c) {
          window._dbgPush(`[GEP] 챔피언 이벤트: ${c}`);
          cb({ name:c, id:c.toLowerCase() });
        }
      });
      // background가 보내는 메시지 수신 (챔피언 선택 화면 / 소환사 정보 / 게임 스냅샷)
      overwolf.windows.onMessageReceived.addListener(msg => {
        if (msg.id === 'champ_select' && msg.content?.championId) {
          _emit('champId', msg.content.championId);
        }
        if (msg.id === 'summoner_info') {
          _emit('summonerInfo', msg.content);
        }
        if (msg.id === 'game_flow') {
          _emit('gameFlow', msg.content);
        }
        // Task 9: background가 getInfo() 결과로 보내는 게임 스냅샷
        if (msg.id === 'game_snapshot') {
          _emit('gameSnapshot', msg.content || {});
        }
      });
    } else { _on('champion', cb); }
  },
  onSummonerInfo(cb) { _on('summonerInfo', cb); },
  onChampId(cb)      { _on('champId', cb); },
  onGameFlow(cb)     { _on('gameFlow', cb); },
  onGameSnapshot(cb) { _on('gameSnapshot', cb); },
  onKeyDown(cb) {
    if (IS_OW) {
      overwolf.games.inputTracking.onKeyDown.addListener(e =>
        cb({ key: vkToKey(e.key), t: performance.now() })
      );
    } else {
      document.addEventListener('keydown', e => {
        if (!e.repeat) {
          let key = e.key;
          // 브라우저 key명 → OW VK명과 통일 (F1-F12는 이미 일치)
          const NORM = { Escape:'ESC', Enter:'ENTER', Tab:'TAB', ' ':'SPACE', Control:'CTRL', Shift:'SHIFT', Alt:'ALT' };
          key = key.length === 1 ? key.toUpperCase() : (NORM[key] || key);
          cb({ key, t: performance.now() });
        }
      });
    }
  },
  // AA: 마우스 좌클릭 감지 (어택무브 포함, 클릭 스팸도 자연스럽게 매칭됨)
  onMouseDown(cb) {
    if (IS_OW) {
      overwolf.games.inputTracking.onMouseDown.addListener(e => {
        if (e.button === 0) cb({ key:'AA', t: performance.now() });
      });
    } else {
      document.addEventListener('mousedown', e => {
        if (e.button === 0) cb({ key:'AA', t: performance.now() });
      });
    }
  },
  onHotkey(name, cb) {
    if (IS_OW) {
      overwolf.settings.hotkeys.onPressed.addListener(e => { if (e.name===name) cb(); });
    }
  },
};

// Data Dragon
window.ddUrl = (patch, type, id) =>
  `https://ddragon.leagueoflegends.com/cdn/${patch}/img/${type}/${id}`;

// 전역 debug 로그 (React 외부 코드도 사용)
window._dbgLines = [];
window._dbgPush = (msg) => {
  const line = new Date().toLocaleTimeString('ko', {hour12:false}) + ' ' + msg;
  window._dbgLines = [line, ...window._dbgLines].slice(0, 14);
  window._dbgCallback?.(window._dbgLines);
  console.log('[CGG]', msg);
};

window.fetchChampionData = async (champName) => {
  try {
    const versions = await fetch('https://ddragon.leagueoflegends.com/api/versions.json').then(r=>r.json());
    const patch = versions[0];
    // "Lee Sin" → "LeeSin" (공백 제거로 DataDragon 키 변환)
    const key = encodeURIComponent(champName.replace(/\s+/g, ''));
    const data = await fetch(
      `https://ddragon.leagueoflegends.com/cdn/${encodeURIComponent(patch)}/data/en_US/champion/${key}.json`
    ).then(r=>r.json());
    return { patch, champ: data.data[key] };
  } catch(e) {
    window._dbgPush(`[DDragon] ${champName} 실패: ${e?.message || e}`);
    return null;
  }
};

window.fetchCombos = async (characterId, token) => {
  const params = new URLSearchParams({ characterSlug: characterId });
  const url = `https://combogg-web.vercel.app/api/combos/curated?${params}`;
  window._dbgPush(`[API] GET curated character=${characterId}${token ? ' (auth)' : ' (no auth)'}`);
  try {
    const headers = {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const r = await fetch(url, { headers });
    if (!r.ok) {
      window._dbgPush(`[API] HTTP ${r.status}`);
      return [];
    }
    const d = await r.json();
    const list = Array.isArray(d) ? d
               : Array.isArray(d.items) ? d.items
               : Array.isArray(d.combos) ? d.combos
               : [];
    window._dbgPush(`[API] curated ${list.length}개 수신 (${characterId})`);
    return list.map(normalizeCombo);
  } catch(e) {
    window._dbgPush(`[API] 오류: ${e?.message || e}`);
    return [];
  }
};

function normalizeCombo(c) {
  const rawInputs = c.inputSummary || c.inputs || [];
  // API는 camelCase로 반환 (durationMs), 로컬 목 데이터는 duration_ms
  const totalMs = c.durationMs || c.duration_ms || 10000;

  const inputs = rawInputs.map((inp, i) => {
    // 타이밍 없으면 totalMs 안에서 균등 배분
    const t = inp.t != null ? inp.t : Math.round((totalMs / Math.max(rawInputs.length, 1)) * i);

    let key, label;
    if (inp.category === 'attack' || inp.category === 'attack_cancel') {
      key = 'AA';
      label = inp.category === 'attack_cancel' ? '평캔' : '평타';
    } else if (inp.category === 'summoner_spell') {
      key = String(inp.slot || 'D');
      label = inp.ref || '소환사 주문';
    } else if (inp.category === 'item') {
      key = String(inp.slot || '1');
      // 아이템 ID를 라벨로 표시 (아이콘은 ref 활용)
      label = inp.ref ? `아이템` : `슬롯${inp.slot}`;
    } else if (inp.category === 'skill') {
      // "LeeSinQ2" → Q, "LeeSinW2" → W, "RivenQ" → Q 등
      // 스킬 레터만 추출 (뒤에 붙는 숫자는 2번째 발동 표시이므로 키는 동일)
      key = inp.ref?.match(/([QWER])\d*$/)?.[1]
          || inp.ref?.replace(/^[A-Za-z]+/, '')[0]
          || inp.key || '?';
      // 라벨: Q, Q2(재발동), W2(재발동) 등
      const skillSuffix = inp.ref?.match(/[QWER](\d*)$/)?.[1];
      label = key + (skillSuffix ? (skillSuffix === '2' ? ' 재발동' : ` ${skillSuffix}타`) : '');
    } else {
      key = inp.ref?.replace(/^[A-Za-z]+/, '') || inp.key || '?';
      label = inp.label || inp.ref || inp.category || '?';
    }

    return { t, key, label };
  });

  return {
    id: c.id,
    title: c.title,
    difficulty: c.difficulty,
    duration_ms: totalMs,
    inputs,
    steps: c.steps || [],
    game_specific: c.game_specific || c.gameSpecific || null,
    source: c.source || null, // 'saved' | 'featured' | 'popular' (curated endpoint)
  };
}

// ── .tutfile Blob 생성 공유 헬퍼 ────────────────────────────────────
// handleDownload 와 handleShare 양쪽에서 재사용
// take 파라미터가 있으면 videoBytes를 ZIP에 포함
window.buildTutfileBlob = ({ title, description, difficulty, tags, characterId, characterName, inputs, patch, take }) => {
  const now = new Date().toISOString();
  const durationMs = take?.durationMs
    ?? (inputs.length ? inputs[inputs.length - 1].t + 200 : 0);
  const manifest = {
    version: '1.0', id: crypto.randomUUID(),
    title,
    description: description || '',
    game: 'lol', character: characterId,
    difficulty, tags: Array.isArray(tags) ? tags : [],
    duration_ms: durationMs,
    patch_version: patch || '15.1',
    author: 'overlay', created_at: now,
    // Task 9 → Task 8 wire-up: take.gameSnapshot가 있으면 game_specific으로 포함
    game_specific: take?.gameSnapshot || {},
  };
  // ── 입력 자동 분류 ────────────────────────────────────────────────
  // take.gameSnapshot 에서 아이템·소환사 주문 메타데이터를 가져와
  // 녹화된 raw 키를 적절한 category 로 매핑한다.
  const snap = take?.gameSnapshot || {};
  const items = Array.isArray(snap.required_items) ? snap.required_items : [];
  const summoners = Array.isArray(snap.summoner_spells) ? snap.summoner_spells : [];
  // summoner spells: index 0 = D slot, index 1 = F slot
  // 한글 표시 이름이면 그대로 ref로. 영문 ID로 변환은 web/edit에서 해도 됨.

  function classifyInput({ key, t }) {
    const out = { t: Math.round(t) };
    // 1) 평타 / 평타 캔슬
    if (key === 'AA' || key === 'AttackMove') {
      out.category = 'attack';
      return out;
    }
    // 2) 숫자 키 1-6 → 아이템 슬롯
    const numMatch = /^([1-6])$/.exec(key);
    if (numMatch) {
      const slot = parseInt(numMatch[1], 10);
      out.category = 'item';
      out.slot = slot;
      const ref = items[slot - 1]; // slot 1 → items[0]
      if (ref) out.ref = String(ref);
      return out;
    }
    // 3) Q/W/E/R → 챔프 스킬
    const letter = (key || '').toUpperCase();
    if (['Q', 'W', 'E', 'R'].includes(letter)) {
      out.category = 'skill';
      out.ref = `${characterName || ''}${letter}`;
      return out;
    }
    // 4) D/F → 소환사 주문
    if (letter === 'D' || letter === 'F') {
      out.category = 'summoner_spell';
      out.slot = letter;
      const ref = letter === 'D' ? summoners[0] : summoners[1];
      if (ref) out.ref = String(ref);
      return out;
    }
    // 5) 기타 — raw key 보존 (편집 페이지에서 분류)
    out.category = 'key';
    out.ref = key;
    return out;
  }

  const inputsJson = { inputs: inputs.map(classifyInput) };
  const stepsData = take?.steps?.length > 0 ? take.steps : [];
  const stepsJson = { steps: stepsData };

  const enc = new TextEncoder();
  const files = {
    'manifest.json': enc.encode(JSON.stringify(manifest, null, 2)),
    'inputs.json':   enc.encode(JSON.stringify(inputsJson, null, 2)),
    'steps.json':    enc.encode(JSON.stringify(stepsJson, null, 2)),
  };

  // take에 videoBytes가 있으면 video.mp4로 포함 (fflate는 Uint8Array를 직접 받음)
  if (take?.videoBytes && take.videoBytes.byteLength > 0) {
    files['video.mp4'] = take.videoBytes;
  }

  const zip = fflate.zipSync(files);
  return new Blob([zip], { type: 'application/zip' });
};

// ── 녹화 .tutfile 로컬 다운로드 ───────────────────────────────────
window.downloadTutfile = ({ title, difficulty, characterId, characterName, inputs, patch }) => {
  try {
    const blob = window.buildTutfileBlob({ title, difficulty, characterId, characterName, inputs, patch });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${title.replace(/[^\w가-힣]/g, '_')}.tutfile`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    const uploadPage = 'https://combogg-web.vercel.app/upload';
    if (IS_OW) overwolf.utils.openUrlInDefaultBrowser(uploadPage);
    else window.open(uploadPage, '_blank');

    return { ok: true };
  } catch (e) {
    window._dbgPush(`[record] 다운로드 오류: ${e?.message || e}`);
    return { ok: false, error: e?.message };
  }
};

const WIDGET_MIN_W = 180;
const WIDGET_MIN_H = 100;

const Widget = ({ defaultPos, width, children, visible=true, scale=1 }) => {
  const [pos,  setPos]  = useState(defaultPos);
  const [size, setSize] = useState({ w: width, h: null }); // h=null → auto height

  // ── 드래그 이동 (헤더) — clientXY(시각)를 unscaled 좌표로 변환 ──────
  const onPointerDown = useCallback(e => {
    if (!e.target.closest('.wh')) return;
    const startX = e.clientX, startY = e.clientY;
    const startPX = pos.x,    startPY = pos.y;
    const onMove = ev => setPos({
      x: Math.round(startPX + (ev.clientX - startX) / scale),
      y: Math.round(startPY + (ev.clientY - startY) / scale),
    });
    const onUp = ev => {
      setPos({
        x: Math.round(startPX + (ev.clientX - startX) / scale),
        y: Math.round(startPY + (ev.clientY - startY) / scale),
      });
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    e.preventDefault();
  }, [pos, scale]);

  // ── 리사이즈 (우하단 모서리) — getBoundingClientRect는 시각 크기 반환 ─
  const onResizeDown = e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    const rect   = e.currentTarget.parentElement.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const startW = rect.width  / scale;   // 시각→unscaled
    const startH = rect.height / scale;
    const onMove = ev => setSize({
      w: Math.max(WIDGET_MIN_W, Math.round(startW + (ev.clientX - startX) / scale)),
      h: Math.max(WIDGET_MIN_H, Math.round(startH + (ev.clientY - startY) / scale)),
    });
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };

  if (!visible) return null;
  return (
    <div data-widget="true" onPointerDown={onPointerDown} style={{
      position:'absolute', left:pos.x, top:pos.y,
      width: size.w,
      height: size.h ?? 'auto',
      background:'rgba(8,12,30,0.78)',
      border:'1.5px solid rgba(0,190,255,0.35)', borderRadius:12,
      boxShadow:'0 0 0 1px rgba(0,0,0,0.6), 0 16px 40px rgba(0,0,0,0.6), 0 0 30px rgba(0,120,255,0.15)',
      overflow: 'visible', // 내부 dropdown(..., 메뉴) 등이 widget 경계 밖으로 나가야 하므로 항상 visible
      animation:'widgetIn 0.25s ease', color:'#fff',
      display:'flex', flexDirection:'column',
      pointerEvents:'auto',
    }}>
      {/* 상단 네온 라인 */}
      <div style={{ height:2.5, flexShrink:0, background:'linear-gradient(90deg,transparent,rgba(0,200,255,0.9),rgba(140,60,255,0.7),transparent)' }} />
      {/* 콘텐츠: 리사이즈 시에만 flex:1로 채움, 아닐 때는 자연 높이 */}
      <div style={{ flex: size.h ? 1 : '0 0 auto', overflowY: size.h ? 'auto' : 'visible', overflowX:'hidden', minWidth:0 }}>
        {children}
      </div>
      {/* 리사이즈 핸들 */}
      <div onPointerDown={onResizeDown} style={{
        position:'absolute', right:0, bottom:0, width:18, height:18,
        cursor:'nwse-resize', zIndex:10, borderRadius:'0 0 10px 0',
        display:'flex', alignItems:'flex-end', justifyContent:'flex-end',

const ReqChip = ({ label, met, iconUrl, noData }) => {

const RequirementsWidget = ({ gameSpecific, playerStats, patch }) => {
  if (!gameSpecific) return null;
  const gs  = gameSpecific;
  const ps  = playerStats;
  const has = ps !== null; // stats 도착 여부

  const chips = [];

  // 레벨
  if (gs.required_level != null) {
    const cur = ps?.level;
    chips.push(<ReqChip key="lv"
      label={`Lv ${gs.required_level}`}
      met={has && cur >= gs.required_level}
      noData={!has}
    />);
  }

  // 스킬 가속 (서버는 cooldownReduction 0~1로 줌, AH = CDR/(1-CDR)*100)
  if (gs.ability_haste_min != null) {
    const cur = ps?.abilityHaste;
    chips.push(<ReqChip key="ah"
      label={`스킬가속 ${gs.ability_haste_min}`}
      met={has && cur >= gs.ability_haste_min}
      noData={!has}
    />);
  }

  // 공격 속도
  if (gs.attack_speed_min != null) {
    const cur = ps?.attackSpeed;
    chips.push(<ReqChip key="as"
      label={`공속 ${gs.attack_speed_min}`}
      met={has && cur >= gs.attack_speed_min}
      noData={!has}
    />);
  }

  // 아이템
  if (gs.required_items?.length) {
    gs.required_items.forEach(itemId => {
      const met   = has && ps.items?.includes(String(itemId));
      const iUrl  = patch ? `https://ddragon.leagueoflegends.com/cdn/${patch}/img/item/${itemId}.png` : null;
      chips.push(<ReqChip key={`item-${itemId}`}
        label={String(itemId)}
        met={met}
        noData={!has}
        iconUrl={iUrl}
      />);
    });
  }

  if (!chips.length) return null;

  const allMet  = has && chips.every((_, i) => {
    const gs2 = gameSpecific;
    if (gs2.required_level    != null && i===0) return ps?.level >= gs2.required_level;
    return true;
  });
  // 간단히 실제 met 계산
  const metCount = [
    gs.required_level    != null && has && ps?.level >= gs.required_level,
    gs.ability_haste_min != null && has && ps?.abilityHaste >= gs.ability_haste_min,
    gs.attack_speed_min  != null && has && ps?.attackSpeed  >= gs.attack_speed_min,
    ...(gs.required_items||[]).map(id => has && ps?.items?.includes(String(id))),
  ].filter(Boolean).length;
  const totalCount = chips.length;
  const allGood = has && metCount === totalCount;

  return (
    <div style={{ padding:'6px 12px 7px', borderBottom:'1px solid rgba(0,180,255,0.08)',
      background: allGood
        ? 'rgba(0,255,170,0.03)'
        : has ? 'rgba(255,40,80,0.03)' : 'rgba(255,255,255,0.02)' }}>
      {has && (
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:6 }}>
          <span style={{ fontFamily:'monospace', fontSize:11, fontWeight:700, letterSpacing:1,
            color: allGood ? '#00ffaa' : '#ff5577',
            textShadow: allGood ? '0 0 8px rgba(0,255,170,0.5)' : '0 0 8px rgba(255,40,80,0.4)' }}>
            {allGood ? '✓ 조건 충족' : `⚠ ${totalCount - metCount}개 미충족`}
          </span>
        </div>
      )}
      <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
        {chips}
      </div>
    </div>
  );
};

// ── 4. 콤보 시퀀스 — 테이프 뷰 (전체 키 동시 표시) ─────────────
const QUALITY_LABEL = { perfect:'PERFECT', good:'GOOD', ok:'OK', miss:'MISS' };
const QUALITY_COLOR = { perfect:'#ffe566', good:'#00ffaa', ok:'#00d4ff', miss:'#ff3366' };

// ── 4. 콤보 시퀀스 — 단계별 전체 가이드 ──────────────────────────
const ComboSequenceWidget = ({ combo, playMs, totalMs, score, lastQuality, loopMode, runCount, playState, liveInputs }) => {
  if (!combo) return (
    <div style={{padding:20,color:'rgba(255,255,255,0.35)',fontSize:13,textAlign:'center',fontFamily:'monospace'}}>
      콤보를 선택하세요
    </div>
  );

  const total   = totalMs || (combo.inputs[combo.inputs.length-1]?.t || 0) + 800;
  const pct     = Math.min(100, (playMs / total) * 100);
  const isActive = playState === 'playing';
  const loopLabel = loopMode === 'inf' ? '∞' : loopMode === 'once' ? '1' : loopMode.replace('x','');

  // 현재 입력 인덱스
  let curIdx = 0;
  for (let i = 0; i < combo.inputs.length; i++) {
    if (playMs >= combo.inputs[i].t) curIdx = i;
  }

  // 인덱스 포함한 inputs
  const indexedInputs = combo.inputs.map((inp, gi) => ({ ...inp, gi }));

  // 단계별 그룹 (단계 없으면 전체를 하나로)
  const groups = combo.steps?.length > 0
    ? combo.steps.map(s => ({
        label: s.label,
        start: s.start, end: s.end,
        inputs: indexedInputs.filter(inp => inp.t >= s.start && inp.t < s.end),
      }))
    : [{ label: null, inputs: indexedInputs }];

  return (
    <div>
      {/* ── 단계별 가이드 (전체 동시 표시) ── */}
      <div style={{ padding:'8px 12px 5px' }}>
        {groups.map((g, gi) => {
          const isStep  = g.start != null;
          const active  = isStep && playMs >= g.start && playMs < g.end;
          const done    = isStep && playMs >= g.end;
          return (
            <div key={gi} style={{
              display:'flex', alignItems:'center', gap:7,
              padding:'5px 8px', marginBottom: gi < groups.length-1 ? 4 : 0,
              borderRadius:6,
              background: active ? 'rgba(0,200,255,0.07)' : 'rgba(255,255,255,0.02)',
              borderLeft:`3px solid ${active ? '#00d4ff' : done ? 'rgba(0,200,255,0.22)' : 'rgba(255,255,255,0.07)'}`,
              transition:'background 0.2s, border-color 0.2s',
            }}>
              {/* 단계 레이블 */}
              {g.label && (
                <span style={{
                  fontFamily:'monospace', fontSize:12, fontWeight:700, letterSpacing:1,
                  minWidth:24, flexShrink:0,
                  color: active ? '#00d4ff' : done ? 'rgba(0,200,255,0.6)' : 'rgba(255,255,255,0.55)',
                  textShadow: active ? '0 0 8px rgba(0,200,255,0.7)' : 'none',
                }}>
                  {g.label}
                </span>
              )}
              {/* 키 시퀀스 */}
              <div style={{ display:'flex', gap:3, alignItems:'center', flexWrap:'wrap' }}>
                {g.inputs.map((inp, ii) => {
                  const isCur  = inp.gi === curIdx && (active || !isStep);
                  const isPast = inp.gi < curIdx;
                  return (
                    <React.Fragment key={ii}>
                      {ii > 0 && (
                        <span style={{ color:'rgba(255,255,255,0.45)', fontSize:12 }}>›</span>
                      )}
                      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:1 }}>
                        <Keycap k={inp.key} size={34} accent={isCur} dim={isPast && !active} />
                        {isCur && (
                          <span style={{ fontSize:10, fontFamily:'monospace', color:'#00d4ff',
                            textShadow:'0 0 8px rgba(0,200,255,0.8)', fontWeight:700, whiteSpace:'nowrap' }}>
                            {inp.label}
                          </span>
                        )}
                      </div>
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* ── 현재 런 실시간 입력 (가이드 바로 아래) ── */}
      {(playState === 'playing' || playState === 'countdown') && (
        <div style={{ padding:'6px 14px 8px',
          borderTop:'1px solid rgba(255,255,255,0.05)' }}>
          <div style={{ display:'flex', gap:5, alignItems:'center', flexWrap:'wrap' }}>
            <span style={{ fontFamily:'monospace', fontSize:10, color:'#00ffaa', letterSpacing:1.5, flexShrink:0,
              textShadow:'0 0 8px rgba(0,255,170,0.6)' }}>●</span>
            {liveInputs.length === 0
              ? <span style={{ fontFamily:'monospace', fontSize:13, color:'rgba(255,255,255,0.55)' }}>대기 중…</span>
              : liveInputs.slice(-12).map((inp, i) => (
                  <React.Fragment key={inp.id}>
                    {i > 0 && <span style={{ color:'rgba(255,255,255,0.45)', fontSize:12 }}>›</span>}
                    <Keycap k={inp.key} size={28} />
                  </React.Fragment>
                ))
            }
          </div>
        </div>
      )}

      {/* ── 프로그레스 바 + 점수 ── */}
      <div style={{ padding:'0 14px 10px', display:'flex', alignItems:'center', gap:12 }}>
        <div style={{ flex:1 }}>
          <div style={{ height:5, background:'rgba(255,255,255,0.07)', borderRadius:4, overflow:'hidden', position:'relative' }}>
            <div style={{ height:'100%', width:`${pct}%`,
              background: isActive ? 'linear-gradient(90deg,#0044cc,#00aaff,#00ffcc)' : 'rgba(255,255,255,0.15)',
              borderRadius:4, transition:'width 0.05s linear',
              boxShadow: isActive ? '0 0 12px rgba(0,200,255,0.7)' : 'none' }} />
            {[25,50,75].map(p => (
              <div key={p} style={{ position:'absolute', top:0, bottom:0, left:`${p}%`, width:1,
                background:'rgba(255,255,255,0.1)', pointerEvents:'none' }} />
            ))}
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', marginTop:3,
            fontFamily:'monospace', fontSize:10, color:'rgba(255,255,255,0.55)' }}>
            <span style={{ color:'rgba(0,200,255,0.75)' }}>
              {runCount > 0 ? `${runCount}/${loopLabel} 완료` : `×${loopLabel}`}
            </span>
            <span>{(total/1000).toFixed(1)}s</span>
          </div>
        </div>
        {/* 점수 + 판정 */}
        <div style={{ flexShrink:0, textAlign:'right', minWidth:64 }}>
          {lastQuality && (
            <div style={{ fontSize:10, fontWeight:900, letterSpacing:2, color:QUALITY_COLOR[lastQuality],
              textShadow:`0 0 12px ${QUALITY_COLOR[lastQuality]}`, animation:'fadeIn 0.12s ease', marginBottom:2 }}>
              {QUALITY_LABEL[lastQuality]}
            </div>
          )}
          <div style={{ fontFamily:'monospace', fontSize:22, fontWeight:900, lineHeight:1,
            color:score>0?'#ffe566':'rgba(255,255,255,0.35)',
            textShadow: score>0 ? '0 0 14px rgba(255,220,60,0.6)' : 'none' }}>
            {score > 0 ? score : '—'}
          </div>
          {score > 0 && <div style={{ fontFamily:'monospace', fontSize:10, color:'rgba(255,220,60,0.7)', letterSpacing:1 }}>pts</div>}
        </div>
      </div>
    </div>
  );
};

// ── 5. 런 기록 — 직전 런 + 이전 드롭다운 ────────────────────────
const RunHistoryWidget = ({ runLog, playState }) => {
  const [open, setOpen] = useState(false);
  if (runLog.length === 0) return null;

  const sorted  = [...runLog].reverse(); // 최신 순
  const latest  = sorted[0];
  const older   = sorted.slice(1);

  const RunRow = ({ run, highlight }) => (
    <div style={{
      display:'flex', alignItems:'center', gap:8, padding:'6px 10px', borderRadius:6,
      background: highlight ? 'rgba(0,200,255,0.06)' : 'rgba(255,255,255,0.02)',
      border:`1px solid ${highlight ? 'rgba(0,200,255,0.2)' : 'rgba(255,255,255,0.05)'}`,
    }}>
      <span style={{ fontFamily:'monospace', fontSize:10, color:'rgba(255,255,255,0.6)', flexShrink:0 }}>
        #{run.runIdx}
      </span>
      <div style={{ display:'flex', gap:3, alignItems:'center', flex:1, flexWrap:'wrap' }}>
        {run.inputs.map((inp, j) => (
          <React.Fragment key={j}>
            {j > 0 && <span style={{ color:'rgba(255,255,255,0.45)', fontSize:10 }}>›</span>}
            <Keycap k={inp.key} size={22} />
          </React.Fragment>
        ))}
      </div>
      <span style={{ fontFamily:'monospace', fontSize:11, color:'#ffe566', flexShrink:0,
        textShadow:'0 0 8px rgba(255,220,60,0.4)' }}>
        {run.score}pts
      </span>
    </div>
  );

  return (
    <div style={{ padding:'4px 14px 10px' }}>
      {/* 직전 런 */}
      <div style={{ fontFamily:'monospace', fontSize:11, fontWeight:700, letterSpacing:1, color:'rgba(0,200,255,0.75)', marginBottom:6 }}>
        직전 런
      </div>
      <RunRow run={latest} highlight />

      {/* 이전 런 드롭다운 */}
      {older.length > 0 && (
        <div style={{ marginTop:6 }}>
          <div onClick={() => setOpen(v => !v)} style={{
            display:'flex', alignItems:'center', gap:6, cursor:'pointer', padding:'4px 0',
          }}>
            <span style={{ fontFamily:'monospace', fontSize:11, color:'rgba(0,200,255,0.75)' }}>
              {open ? '▲' : '▼'} 이전 기록 ({older.length}개)
            </span>
          </div>
          {open && (
            <div style={{ display:'flex', flexDirection:'column', gap:4, marginTop:4 }}>
              {older.map(run => <RunRow key={run.runIdx} run={run} />)}
            </div>
          )}
        </div>
      )}
    </div>
  );
};

// ── 6. 녹화 테이크 로그 ──────────────────────────────────────────
const RecordLogWidget = ({ takes, practiceRuns = [], recordState, onSelectTake, onDeleteTake, selectedTakeId, onDownload, downloadState, onShare, onPreview }) => {
  const [moreOpen, setMoreOpen] = useState(false);
  const [moreMenuPos, setMoreMenuPos] = useState({ left: 0, top: 0 });
  const moreBtnRef = React.useRef(null);
  // 위젯 외부 클릭으로 메뉴 닫기
  useEffect(() => {
    if (!moreOpen) return;
    const onDocClick = () => setMoreOpen(false);
    window.addEventListener('click', onDocClick);
    return () => window.removeEventListener('click', onDocClick);
  }, [moreOpen]);

  if (takes.length === 0 && practiceRuns.length === 0 && recordState === 'idle') return (
    <div style={{ padding:'14px', fontFamily:'monospace', fontSize:11, color:'rgba(255,255,255,0.3)', textAlign:'center' }}>
      F11로 녹화 시작
    </div>
  );

  const REC_COLOR = '#ff3366';
  const fmt = ms => `${(ms / 1000).toFixed(1)}s`;
  const fmtTs = ts => {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  };

  return (
    <div style={{ padding:'8px 12px 12px' }}>
      {/* 현재 녹화 중 표시 */}
      {recordState === 'recording' && (
        <div style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 10px', marginBottom:8,
          borderRadius:6, background:'rgba(255,30,60,0.1)', border:'1px solid rgba(255,30,60,0.4)',
          animation:'pulse 1s infinite' }}>
          <span style={{ width:8, height:8, borderRadius:'50%', background:REC_COLOR, flexShrink:0,
            boxShadow:`0 0 8px ${REC_COLOR}` }} />
          <span style={{ fontFamily:'monospace', fontSize:12, fontWeight:700, color:REC_COLOR,
            letterSpacing:1 }}>REC</span>
          <span style={{ fontFamily:'monospace', fontSize:11, color:'rgba(255,255,255,0.5)', flex:1 }}>
            F11 정지  /  ESC 취소
          </span>
        </div>
      )}

      {/* 테이크 목록 — 스크롤 가능 */}
      {takes.length > 0 && (
        <div style={{ marginBottom:8 }}>
          <div style={{ fontFamily:'monospace', fontSize:10, letterSpacing:1.5, fontWeight:700,
            color:'rgba(255,255,255,0.5)', marginBottom:6 }}>테이크</div>
          <div style={{ display:'flex', flexDirection:'column', gap:3, maxHeight:320, overflowY:'auto' }}>
            {[...takes].reverse().map(tk => {
              const sel = tk.id === selectedTakeId;
              const keys = tk.inputs.map(i => i.key).filter(Boolean);
              const KEY_LIMIT = 14;
              const shownKeys = keys.slice(0, KEY_LIMIT);
              const hiddenCount = Math.max(0, keys.length - KEY_LIMIT);
              return (
                <div key={tk.id} onClick={() => onSelectTake(tk.id)}
                  style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 8px', cursor:'pointer',
                    borderRadius:6, border:`1px solid ${sel ? 'rgba(0,200,255,0.5)' : 'rgba(255,255,255,0.07)'}`,
                    background: sel ? 'rgba(0,200,255,0.08)' : 'rgba(255,255,255,0.02)',
                    transition:'all 0.12s', minHeight: 28 }}>
                  <span style={{ fontFamily:'monospace', fontSize:10, color:'rgba(255,255,255,0.4)', flexShrink:0 }}>
                    #{tk.idx}
                  </span>
                  <span style={{ fontFamily:'monospace', fontSize:10, fontWeight:700,
                    color: sel ? '#00d4ff' : 'rgba(255,255,255,0.55)', flexShrink:0 }}>
                    {fmt(tk.durationMs)}
                  </span>
                  <div style={{ flex:1, display:'flex', alignItems:'center', gap:3, flexWrap:'nowrap', overflow:'hidden' }}>
                    {shownKeys.map((k, i) => (
                      <span key={i} style={{
                        fontFamily:'monospace', fontSize:10, fontWeight:700,
                        color: sel ? 'rgba(0,212,255,0.95)' : 'rgba(255,255,255,0.78)',
                        background: sel ? 'rgba(0,200,255,0.12)' : 'rgba(255,255,255,0.06)',
                        padding:'1px 4px', borderRadius:3, lineHeight:1.4,
                        flexShrink:0,
                      }}>{k}</span>
                    ))}
                    {hiddenCount > 0 && (
                      <span style={{ fontFamily:'monospace', fontSize:9, color:'rgba(255,255,255,0.35)', flexShrink:0 }}>
                        +{hiddenCount}
                      </span>
                    )}
                  </div>
                  {/* 삭제 버튼 — title 툴팁으로 명시. hover 시 빨간색 진하게 */}
                  <div onPointerDown={e => e.stopPropagation()}
                    onClick={e => { e.stopPropagation(); onDeleteTake(tk.id); }}
                    onMouseEnter={e => e.currentTarget.style.color='rgba(255,80,100,1)'}
                    onMouseLeave={e => e.currentTarget.style.color='rgba(255,80,100,0.55)'}
                    title="이 take 삭제"
                    style={{ cursor:'pointer', fontSize:14, color:'rgba(255,80,100,0.55)',
                      padding:'0 6px', lineHeight:1, userSelect:'none', flexShrink:0,
                      transition:'color 0.12s' }}>
                    🗑
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* 연습 기록 — F9 미리보기/연습 완료시 score 누적 */}
      <div style={{ marginBottom:8, borderTop: takes.length > 0 ? '1px solid rgba(255,255,255,0.07)' : 'none', paddingTop: takes.length > 0 ? 8 : 0 }}>
        <div style={{ fontFamily:'monospace', fontSize:10, letterSpacing:1.5, fontWeight:700,
          color:'rgba(255,255,255,0.5)', marginBottom:6 }}>연습 기록</div>
        {practiceRuns.length === 0 ? (
          <div style={{ fontFamily:'monospace', fontSize:10, color:'rgba(255,255,255,0.25)',
            padding:'4px 0', textAlign:'center' }}>
            연습 기록 없음
          </div>
        ) : (
          <div style={{ display:'flex', flexDirection:'column', gap:3, maxHeight:320, overflowY:'auto' }}>
            {practiceRuns.map(pr => {
              const score = Number.isFinite(pr.score) ? Math.round(pr.score) : 0;
              const scoreColor = score >= 90 ? '#00ff88' : score >= 70 ? '#00d4ff' : score >= 40 ? '#ffcc00' : '#ff6b6b';
              return (
                <div key={pr.id}
                  style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 8px',
                    borderRadius:6, border:'1px solid rgba(255,255,255,0.07)',
                    background:'rgba(255,255,255,0.02)' }}>
                  <span style={{ fontFamily:'monospace', fontSize:10, color:'rgba(255,255,255,0.4)', flexShrink:0 }}>
                    {fmtTs(pr.ts)}
                  </span>
                  <span style={{ fontFamily:'monospace', fontSize:11, fontWeight:600,
                    color:'rgba(255,255,255,0.7)', flex:1, overflow:'hidden', textOverflow:'ellipsis',
                    whiteSpace:'nowrap' }}>
                    {pr.comboTitle || '—'}
                  </span>
                  <span style={{ fontFamily:'monospace', fontSize:10, fontWeight:700,
                    color: scoreColor, padding:'1px 6px', borderRadius:4,
                    background:`${scoreColor}1a`, border:`1px solid ${scoreColor}55` }}>
                    {score}점
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* 선택된 테이크 → 다운로드 + 공유 */}
      {selectedTakeId && (
        <div style={{ borderTop:'1px solid rgba(255,255,255,0.07)', paddingTop:8 }}>
          {downloadState ? (
            <div style={{ fontFamily:'monospace', fontSize:11, color:'rgba(0,200,255,0.8)', lineHeight:1.7 }}>
              {downloadState}
            </div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {/* 미리보기 버튼 — 입력이 없으면 비활성 */}
              {(() => {
                const selectedTake = takes.find(t => t.id === selectedTakeId);
                const hasInputs = selectedTake && selectedTake.inputs.length > 0;
                return (
                  <div onPointerDown={e => e.stopPropagation()}
                    onClick={() => {
                      if (!hasInputs) return;
                      if (selectedTake) onPreview(selectedTake);
                    }}
                    style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:6,
                      padding:'8px', borderRadius:6,
                      cursor: hasInputs ? 'pointer' : 'not-allowed', userSelect:'none',
                      background: hasInputs
                        ? 'linear-gradient(135deg,rgba(0,180,80,0.3),rgba(0,255,130,0.15))'
                        : 'rgba(255,255,255,0.03)',
                      border: `1px solid ${hasInputs ? 'rgba(0,220,100,0.55)' : 'rgba(255,255,255,0.1)'}`,
                      color: hasInputs ? '#00ff88' : 'rgba(255,255,255,0.2)',
                      fontFamily:'monospace', fontSize:12, fontWeight:700,
                      boxShadow: hasInputs ? '0 0 10px rgba(0,220,100,0.2)' : 'none',
                      opacity: hasInputs ? 1 : 0.5 }}>
                    ▶ 미리보기
                  </div>
                );
              })()}
              {/* 공유하기 (primary) + ... (more menu) */}
              <div style={{ display:'flex', gap:6, position:'relative' }}>
                <div onPointerDown={e => e.stopPropagation()}
                  onClick={() => {
                    const take = takes.find(t => t.id === selectedTakeId);
                    if (take) onShare(take);
                  }}
                  style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:6,
                    padding:'8px', borderRadius:6, cursor:'pointer', userSelect:'none',
                    background:'linear-gradient(135deg,rgba(60,40,200,0.35),rgba(100,60,255,0.2))',
                    border:'1px solid rgba(100,80,255,0.6)',
                    color:'#a78bfa', fontFamily:'monospace', fontSize:12, fontWeight:700,
                    boxShadow:'0 0 12px rgba(100,80,255,0.25)' }}>
                  공유하기 (브라우저로)
                </div>
                <div ref={moreBtnRef}
                  onPointerDown={e => e.stopPropagation()}
                  onClick={e => {
                    e.stopPropagation();
                    if (!moreOpen && moreBtnRef.current) {
                      const r = moreBtnRef.current.getBoundingClientRect();
                      // 버튼 아래에 메뉴, 화면 우측 끝 넘지 않게 좌표 보정
                      const MENU_W = 180;
                      const left = Math.max(8, Math.min(window.innerWidth - MENU_W - 8, r.right - MENU_W));
                      const top  = r.bottom + 4;
                      setMoreMenuPos({ left, top });
                    }
                    setMoreOpen(v => !v);
                  }}
                  title="추가 옵션"
                  style={{ width:34, display:'flex', alignItems:'center', justifyContent:'center',
                    padding:'8px 0', borderRadius:6, cursor:'pointer', userSelect:'none',
                    background:'rgba(255,255,255,0.04)',
                    border:'1px solid rgba(255,255,255,0.15)',
                    color:'rgba(255,255,255,0.6)', fontFamily:'monospace', fontSize:14, fontWeight:700,
                    lineHeight:1 }}>
                  ⋯
                </div>
                {moreOpen && (
                  <div onPointerDown={e => e.stopPropagation()}
                    onClick={e => e.stopPropagation()}
                    style={{ position:'fixed', left: moreMenuPos.left, top: moreMenuPos.top,
                      width:180, zIndex:9999,
                      background:'rgba(8,12,30,0.97)',
                      border:'1px solid rgba(0,190,255,0.35)',
                      borderRadius:6, padding:'4px',
                      boxShadow:'0 8px 24px rgba(0,0,0,0.6), 0 0 16px rgba(0,120,255,0.15)' }}>
                    <div onClick={() => { setMoreOpen(false); onDownload(); }}
                      style={{ padding:'7px 10px', borderRadius:4, cursor:'pointer',
                        fontFamily:'monospace', fontSize:11, color:'#00d4ff',
                        userSelect:'none' }}
                      onMouseEnter={e => e.currentTarget.style.background='rgba(0,200,255,0.08)'}
                      onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                      ↓ .tutfile 내보내기
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

// ── 5. 키 바인딩 — 3열: [스킬 아이콘] [슬롯/스킬명] [내 바인딩] ─
const BindingsWidget = ({ bindings, onChange, champData, patch }) => {
  const [listening, setListening] = useState(null);

  useEffect(() => {
    if (!listening) return;
    const h = e => {
      e.preventDefault(); e.stopPropagation();
      const k = e.key === 'Escape' ? null : e.key.length === 1 ? e.key.toUpperCase() : null;
      if (k !== null) onChange({ ...bindings, [listening]: k });
      setListening(null);
    };
    window.addEventListener('keydown', h, true);
    return () => window.removeEventListener('keydown', h, true);
  }, [listening, bindings, onChange]);

  const spells = champData?.spells || [];

  const rows = [
    ...['Q','W','E','R'].map((slot, i) => ({
      slot, group:'스킬',
      name: spells[i]?.name || slot,
      iconUrl: spells[i] && patch ? ddUrl(patch, 'spell', spells[i].image.full) : null,
      isClick: false,
    })),
    { slot:'D', group:'소환사', name:'소환사 주문 D', iconUrl:null, isClick:false },
    { slot:'F', group:'소환사', name:'소환사 주문 F', iconUrl:null, isClick:false },
    { slot:'AA', group:'기타', name:'평타', iconUrl:null, isClick:true },
  ];

  let lastGroup = null;
  return (
    <div style={{ padding:'4px 0 6px' }}>
      {rows.map(row => {
        const isL = listening === row.slot;
        const groupHeader = row.group !== lastGroup
          ? <div key={'g'+row.group} style={{ fontFamily:'monospace', fontSize:10, letterSpacing:1.5, textTransform:'uppercase', color:'rgba(255,255,255,0.6)', padding:'6px 12px 2px', fontWeight:600 }}>{row.group}</div>
          : null;
        lastGroup = row.group;
        return (
          <React.Fragment key={row.slot}>
            {groupHeader}
            <div style={{ display:'flex', alignItems:'center', gap:8, padding:'5px 12px', background:isL?'rgba(200,168,74,0.08)':'transparent' }}>
              {/* Col 1: 스킬 아이콘 */}
              <div style={{ width:24, height:24, borderRadius:3, overflow:'hidden', background:'rgba(255,255,255,0.06)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                {row.iconUrl
                  ? <img src={row.iconUrl} width={24} height={24} style={{display:'block'}} onError={e=>e.currentTarget.style.display='none'} />
                  : <span style={{fontFamily:'monospace', fontSize:10, color:'rgba(255,255,255,0.3)', fontWeight:700}}>{row.slot==='AA'?'AA':row.slot}</span>
                }
              </div>
              {/* Col 2: 기본 슬롯 + 스킬명 */}
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, color:'rgba(255,255,255,0.88)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                  {row.name}
                </div>
                {row.isClick && (
                  <div style={{ fontSize:10, fontFamily:'monospace', color:'rgba(255,255,255,0.32)', marginTop:2 }}>
                    마우스 클릭 자동감지
                  </div>
                )}
              </div>
              {/* Col 3: 내 바인딩 */}
              {row.isClick
                ? <span style={{ fontFamily:'monospace', fontSize:12, color:'rgba(200,184,128,0.5)', flexShrink:0 }}>클릭</span>
                : (
                  <div onClick={() => setListening(row.slot)} style={{ cursor:'pointer', flexShrink:0 }}>
                    {isL
                      ? <span style={{ fontFamily:'monospace', fontSize:10, color:'#c8a84a', animation:'pulse 1s infinite' }}>입력…</span>
                      : <Keycap k={bindings[row.slot]||row.slot} size={26} />
                    }
                  </div>
                )
              }
            </div>
          </React.Fragment>
        );
      })}
    </div>
  );
};

// ── 공유 상태 표시 (Draft 업로드 → 브라우저 편집) ────────────────────
// shareState statuses:
//   idle | waiting-video | awaiting-token | uploading | done | token-expired | error
// 게임 입력 충돌 회피를 위해 오버레이 내 폼은 제거. 자동 메타데이터로 draft 업로드 후
// 브라우저로 /combos/[id]/edit 페이지를 열어 사용자가 거기서 편집·게시한다.
const ShareStatus = ({ shareState, onClose, onTokenConfirm, onRetry }) => {
  const [pastedToken, setPastedToken] = React.useState('');

  // awaiting-token 상태가 풀리면 입력값 비우기
  React.useEffect(() => {
    if (shareState?.status !== 'awaiting-token') setPastedToken('');
  }, [shareState?.status]);

  if (!shareState || shareState.status === 'idle') return null;
  const { status, progress, error, editUrl } = shareState;

  // 작은 플로팅 카드 — 화면 상단 중앙에 고정 (좌/우 끝은 듀얼모니터/4K에서 가시영역 밖일 수 있음)
  const cardWrap = {
    position:'fixed', top:20, left:'50%', transform:'translateX(-50%)',
    zIndex:1000, pointerEvents:'auto',
    width:340,
  };
  const boxStyle = {
    background:'rgba(8,12,30,0.97)',
    border:'1.5px solid rgba(100,80,255,0.5)',
    borderRadius:10,
    boxShadow:'0 0 28px rgba(100,80,255,0.25), 0 12px 32px rgba(0,0,0,0.7)',
    padding:'14px 16px',
    color:'#fff',
    position:'relative',
  };
  const closeBtn = (
    <div onClick={onClose} style={{
      position:'absolute', top:6, right:9, cursor:'pointer',
      fontSize:16, color:'rgba(255,255,255,0.45)', lineHeight:1,
      userSelect:'none',
    }}>×</div>
  );
  const titleStyle = (color) => ({
    fontFamily:'monospace', fontSize:12, fontWeight:700,
    color, marginBottom:8, letterSpacing:1,
  });
  const bodyStyle = {
    fontSize:12, color:'rgba(255,255,255,0.72)',
    lineHeight:1.6, marginBottom:10,
  };
  const btnRow = { display:'flex', gap:6 };
  const btnPrimary = {
    flex:1, padding:'7px 8px', borderRadius:5, cursor:'pointer', textAlign:'center',
    background:'linear-gradient(135deg,rgba(60,40,200,0.5),rgba(100,60,255,0.3))',
    border:'1px solid rgba(100,80,255,0.7)',
    color:'#a78bfa', fontFamily:'monospace', fontSize:11, fontWeight:700,
    userSelect:'none',
  };
  const btnGhost = {
    flex:1, padding:'7px 8px', borderRadius:5, cursor:'pointer', textAlign:'center',
    background:'rgba(255,255,255,0.04)',
    border:'1px solid rgba(255,255,255,0.12)',
    color:'rgba(255,255,255,0.55)', fontFamily:'monospace', fontSize:11,
    userSelect:'none',
  };

  if (status === 'waiting-video') {
    return (
      <div style={cardWrap}>
        <div style={boxStyle}>
          {closeBtn}
          <div style={titleStyle('#00d4ff')}>비디오 처리 중…</div>
          <div style={bodyStyle}>리플레이 캡처 마무리 중 (최대 15초)</div>
          <div style={btnRow}>
            <div onClick={onClose} style={btnGhost}>취소</div>
          </div>
        </div>
      </div>
    );
  }

  if (status === 'awaiting-token') {
    return (
      <div style={cardWrap}>
        <div style={boxStyle}>
          {closeBtn}
          <div style={titleStyle('#a78bfa')}>로그인 필요</div>
          <div style={bodyStyle}>
            브라우저에서 ComboGG 로그인 후 토큰을 복사해 붙여넣기 하세요.
          </div>
          <input
            type="text"
            value={pastedToken}
            onChange={e => setPastedToken(e.target.value)}
            placeholder="토큰 붙여넣기..."
            style={{
              width:'100%', padding:'7px 9px', borderRadius:5,
              background:'rgba(255,255,255,0.06)',
              border:'1px solid rgba(100,80,255,0.4)',
              color:'#fff', fontFamily:'monospace', fontSize:11,
              outline:'none', marginBottom:8, boxSizing:'border-box',
            }}
          />
          <div style={btnRow}>
            <div onClick={() => {
              const t = (pastedToken || '').trim();
              if (t) onTokenConfirm(t);
            }} style={btnPrimary}>확인</div>
            <div onClick={onClose} style={btnGhost}>취소</div>
          </div>
        </div>
      </div>
    );
  }

  if (status === 'uploading') {
    return (
      <div style={cardWrap}>
        <div style={boxStyle}>
          {closeBtn}
          <div style={titleStyle('#a78bfa')}>업로드 중…</div>
          <div style={{ height:5, background:'rgba(255,255,255,0.08)', borderRadius:3, overflow:'hidden', marginBottom:6 }}>
            <div style={{
              height:'100%', width:`${progress || 0}%`,
              background:'linear-gradient(90deg,rgba(60,40,200,0.9),rgba(140,100,255,0.9))',
              borderRadius:3, transition:'width 0.3s ease',
            }} />
          </div>
          <div style={{ fontFamily:'monospace', fontSize:10, color:'rgba(255,255,255,0.5)', textAlign:'center' }}>
            {progress || 0}%
          </div>
        </div>
      </div>
    );
  }

  if (status === 'done') {
    return (
      <div style={cardWrap}>
        <div style={boxStyle}>
          {closeBtn}
          <div style={titleStyle('#00ffaa')}>✓ 임시저장 완료!</div>
          <div style={bodyStyle}>
            브라우저에서 편집해주세요.<br/>
            창이 닫혀있으면 [다시 열기]를 누르세요.
          </div>
          <div style={btnRow}>
            <div onClick={() => {
              if (!editUrl) return;
              if (IS_OW) overwolf.utils.openUrlInDefaultBrowser(editUrl);
              else window.open(editUrl, '_blank');
            }} style={{
              ...btnPrimary,

            </div>

    );
  }

  if (status === 'token-expired') {
    return (
      <div style={cardWrap}>
        <div style={boxStyle}>
          {closeBtn}
          <div style={titleStyle('#ffaa44')}>토큰 만료</div>
          <div style={bodyStyle}>토큰이 만료되었습니다. 다시 로그인해주세요.</div>
          <div style={btnRow}>
            <div onClick={onRetry} style={btnPrimary}>다시 로그인</div>
            <div onClick={onClose} style={btnGhost}>취소</div>
          </div>
        </div>
      </div>
    );
  }

  if (status === 'error') {
    return (
      <div style={cardWrap}>
        <div style={boxStyle}>
          {closeBtn}
          <div style={titleStyle('#ff5577')}>업로드 오류</div>
          <div style={bodyStyle}>{error || '알 수 없는 오류가 발생했습니다.'}</div>
          <div style={btnRow}>
            <div onClick={onRetry} style={{
              ...btnPrimary,
              background:'linear-gradient(135deg,rgba(200,40,60,0.35),rgba(255,60,80,0.2))',
              border:'1px solid rgba(255,60,80,0.5)',
              color:'#ff7090',
            }}>
              다시 시도
            </div>
            <div onClick={onClose} style={btnGhost}>취소</div>
          </div>
        </div>
      </div>
    );
  }

  return null;
};

// ── 자동 스텝 감지 — 녹화 정지 시 입력 간격으로 스텝 분할 ────────────
function autoDetectSteps(inputs, durationMs, gapThreshold = 400) {
  if (!inputs || inputs.length < 2) return [];
  const boundaries = [0];
  for (let i = 1; i < inputs.length; i++) {
    if (inputs[i].t - inputs[i - 1].t >= gapThreshold) {
      boundaries.push(inputs[i].t);
    }
  }
  if (boundaries.length === 1) return []; // no gaps found, no steps
  return boundaries.map((start, i) => ({
    start,
    end: boundaries[i + 1] ?? durationMs,
    title: `Step ${i + 1}`,
    tip: ''
  }));
}

// ── 디버그 패널 (드래그 가능, 우측 중간 기본 위치) ─────────────────
const DebugPanelDraggable = ({ children }) => {
  // 우측 중단 기본 (LoL 미니맵 위, HUD 위) — 사용자가 명시 요청한 위치
  const [pos, setPos] = useState(() => ({
    x: Math.max(20, window.innerWidth - 400),
    y: Math.round(window.innerHeight * 0.32),
  }));
  const onPointerDown = useCallback((e) => {
    if (!e.target.closest('.debug-handle')) return;
    const startX = e.clientX, startY = e.clientY;
    const startPX = pos.x, startPY = pos.y;
    const onMove = ev => setPos({
      x: Math.round(startPX + (ev.clientX - startX)),
      y: Math.round(startPY + (ev.clientY - startY)),
    });
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    e.preventDefault();
  }, [pos]);
  return (
    <div
      onPointerDown={onPointerDown}
      style={{
        position:'fixed', left: pos.x, top: pos.y, width: 380, pointerEvents:'auto',
        background:'rgba(0,0,0,0.88)', border:'1px solid rgba(255,200,0,0.4)', borderRadius:8,
        fontFamily:'monospace', fontSize:11, color:'#ffe566', padding:'10px 12px', zIndex:999,
      }}
    >
      {children}
    </div>
  );
};

            : `HTTP ${pr.value?.status}`;
          if (pollCount <= 3 || pollCount % 5 === 0) addDebug(`[RiotAPI] ${reason}`);
        }
        if (ir.status === 'fulfilled' && ir.value.ok) {
          const items = await ir.value.json();
          nextStats.items = items.map(it => String(it.itemID));
        }
        if (Object.keys(nextStats).length) {

      } catch(err) {

    };

    poll();
    let id = setInterval(() => {
      poll();
      if (pollCount === 15) {

        id = setInterval(poll, 5000);

      if (playStateRef.current === 'playing') {
