        curRunInputsRef.current.push({ key: mapped, t: ms, id: t + Math.random() });
        setLiveInputs(prev => [...prev, { key: mapped, t: ms, id: t + Math.random() }]);
        scoreInput(mapped, ms);
      }
    };
  }, []);

  useEffect(() => { recordStateRef.current = recordState; }, [recordState]);

  // stepFlash 자동 리셋 — 미리보기 F12 스텝 마킹 시각 피드백 400ms 후 해제
  useEffect(() => {
    if (!stepFlash) return;
    const timer = setTimeout(() => setStepFlash(false), 400);
    return () => clearTimeout(timer);
  }, [stepFlash]);

  // 재생 시작 시각 추적 — 미리보기 F12 스텝 마킹에 사용
  useEffect(() => {
    if (playState === 'playing') {
      playStartTimeRef.current = performance.now();
    } else {
      playStartTimeRef.current = null;
    }
  }, [playState]);

  // 중앙 키 디스패처 — 매 렌더마다 갱신해 항상 최신 state/ref 참조
  // OW.onKeyDown(inputTracking)을 경유하므로 인게임 F8/F11/ESC 모두 캡처됨
  useEffect(() => {
    masterKeyRef.current = ({ key, t }) => {
      if (key === 'F8') {
        window._dbgPush('[KEY] F8 → 디버그 토글');
        setShowDebug(v => !v);
        return;
      }
      if (key === 'F11') {
        // 카운트다운 중 F11 → 카운트다운 취소
        if (recordCountNumRef.current !== null) {
          window._dbgPush('[KEY] F11 → 카운트다운 취소');
          cancelRecordCountdownRef.current?.();
          return;
        }
        if (recordStateRef.current === 'recording') {
          window._dbgPush('[KEY] F11 → 녹화 정지');
          stopRecordRef.current?.();
        } else {
          window._dbgPush('[KEY] F11 → 녹화 시작 (3-2-1 카운트다운)');
          startRecordRef.current?.();
        }
        return;
      }
      if (key === 'ESC') {
        if (recordCountNumRef.current !== null) {
          window._dbgPush('[KEY] ESC → 카운트다운 취소');
          cancelRecordCountdownRef.current?.();
          return;
        }
        if (recordStateRef.current === 'recording') {
          window._dbgPush('[KEY] ESC → 녹화 취소');
          cancelRecordRef.current?.();
          return;
        }
      }
      if (key === 'F12' && previewComboRef.current && playStartTimeRef.current !== null) {
        const elapsed = Math.round(performance.now() - playStartTimeRef.current);
        window._dbgPush(`[KEY] F12 → 미리보기 스텝 마킹 @ ${elapsed}ms`);
        // previewCombo의 id는 "preview_{takeId}" 형태
        const takeId = previewComboRef.current.id.replace('preview_', '');
        setRecordTakes(prev => prev.map(t => {
          if (t.id !== takeId) return t;
          const currentSteps = t.steps || [];
          const boundaries = [0, ...currentSteps.map(s => s.start).filter(s => s > 0), elapsed]
            .filter((v, i, arr) => arr.indexOf(v) === i) // deduplicate
            .sort((a, b) => a - b);
          const newSteps = boundaries.map((start, i) => ({
            start,
            end: boundaries[i + 1] ?? t.durationMs,
            title: `Step ${i + 1}`,
            tip: ''
          }));
          return { ...t, steps: newSteps };
        }));
        setPreviewCombo(prev => {
          if (!prev) return prev;
          const currentSteps = prev.steps || [];
          const boundaries = [0, ...currentSteps.map(s => s.start).filter(s => s > 0), elapsed]
            .filter((v, i, arr) => arr.indexOf(v) === i)
            .sort((a, b) => a - b);
          return {
            ...prev,
            steps: boundaries.map((start, i) => ({
              start,
              end: boundaries[i + 1] ?? prev.duration_ms,
              title: `Step ${i + 1}`,
              tip: ''
            }))
          };
        });
        setStepFlash(true);
        return;
      }
      if (key === 'F1') { setShow(p => ({ ...p, champion: !p.champion })); return; }
      if (key === 'F3') { setShow(p => ({ ...p, sequence: !p.sequence })); return; }
      if (key === 'F5') { setShow(p => ({ ...p, bindings: !p.bindings })); return; }
      if (key === 'F7') { setShow(p => ({ ...p, video: !p.video })); return; }
      // 게임 입력 — 점수 채점
      inputHandlerRef.current?.({ key, t });
      // 녹화 중이면 입력도 수집
      if (recordStateRef.current === 'recording') {
        const relT = Math.round(t - recordStartRef.current);
        recordInputsRef.current.push({ key, t: relT });
      }
    };
  });

  // OW 리스너 한 번만 등록 — masterKeyRef를 통해 라우팅
  useEffect(() => {
    OW.onKeyDown(e => masterKeyRef.current?.(e));
    OW.onMouseDown(e => {
      inputHandlerRef.current?.(e);
      if (recordStateRef.current === 'recording') {
        const relT = Math.round(e.t - recordStartRef.current);
        recordInputsRef.current.push({ key: 'AA', t: relT });
      }
    });
  }, []);

  // 연습 tick
  useEffect(() => {
    if (playState !== 'playing') return;
    const tick = ts => {
      const ms = (ts - playRef.current.startTime) * playRef.current.speed;
      playRef.current.playMs = ms;
      setPlayMs(ms);
      if (ms >= TOTAL) { onRunComplete(ms); return; }
      rafRef.current = requestAnimationFrame(tick);
    };
    playRef.current.startTime = performance.now();
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [playState, activeId]);

  // togglePlay ref 업데이트
  useEffect(() => {
    togglePlayRef.current = () => {
      if (playStateRef.current === 'idle') startCountdown();
      else {
        cancelAnimationFrame(rafRef.current);
        setPlayState('idle');
        // 미리보기 중 수동 정지 → 미리보기 모드 해제
        if (previewComboRef.current) {
          setPreviewCombo(null);
          previewComboRef.current = null;
          addDebug('[Preview] 수동 정지 — 일반 모드 복귀');
        }
      }
    };
  }, [playState]);

  // ── 녹화 함수 — ref로 직접 정의 (togglePlayRef 패턴, stale closure 없음) ──
  // no-deps → 매 렌더마다 최신 setState를 캡처, recordStateRef로 상태 확인
  useEffect(() => {
    startRecordRef.current = () => {
      if (recordStateRef.current === 'recording') return;
      if (recordCountNumRef.current !== null) return; // 이미 카운트다운 중
      // 1) 카운트다운 시작 (3 → 2 → 1 → REC) — 위젯 자동 숨김
      window._dbgPush('[REC] 카운트다운 시작 — 위젯 숨김 → 깨끗한 footage 확보');
      setRecordCountNum(3);
      let n = 3;
      recordCountIvRef.current = setInterval(() => {
        n--;
        setRecordCountNum(n);
        if (n <= 0) {
          clearInterval(recordCountIvRef.current);
          recordCountIvRef.current = null;
          // 2) 실제 녹화 시작
          recordStartRef.current = performance.now();
          recordInputsRef.current = [];
          setRecordState('recording');
          setShow(prev => ({ ...prev, recordLog: false })); // 녹화 중에는 로그도 숨김 — 영상 깨끗하게
          window._dbgPush('[REC] 녹화 시작');
          // streaming API로 동영상 녹화 시작 — 시작/정지 정확
          if (IS_OW && overwolf.streaming && overwolf.streaming.start) {
            const settings = {
              provider: overwolf.streaming.enums.StreamingProvider.VideoRecorder,
              settings: {
                audio: { mic: { enable: false }, game: { enable: true } },
                video: {
                  auto_calc_kbps: false, // 명시적 bitrate 사용 (auto는 너무 보수적이라 1Mbps 정도로 떨어짐)
                  kbps: 6000, // 1080p 기준 적절한 화질 (~6Mbps). 720p면 4000도 OK
                  fps: 30,
                  width: 0, height: 0, // 0 = 게임 해상도 자동
                  buffer_length: 0, // 과거 버퍼 사용 안 함
                  sub_folder_name: 'ComboGG',
                  // 자동 분할 비활성: 짧은 콤보(보통 5-30초)는 한 파일에 담아야 함
                  max_file_size_bytes: 0, // 0 = 무제한
                  max_quota_gb: 0, // 0 = 디스크 quota 제한 없음
                }
              }
            };
            overwolf.streaming.start(settings, (res) => {
              if (res && res.success && (res.stream_id !== undefined && res.stream_id !== null)) {
                streamIdRef.current = res.stream_id;
                window._dbgPush('[stream] 시작 OK, id=' + res.stream_id);
              } else {
                streamIdRef.current = null;
                window._dbgPush('[stream] 시작 실패: ' + (res?.error || JSON.stringify(res)));
              }
            });
          }
          // 'REC' 인디케이터 잠깐 더 보여주고 사라짐 (애니메이션)
          setTimeout(() => setRecordCountNum(null), 600);
        }
      }, 1000);
    };
    cancelRecordCountdownRef.current = () => {
      if (recordCountIvRef.current) {
        clearInterval(recordCountIvRef.current);
        recordCountIvRef.current = null;
      }
      setRecordCountNum(null);
      // 카운트다운 끝나기 전 취소면 streaming은 아직 시작 안 됨 (start은 카운트다운 끝에서 호출됨).
      // 만약 race로 시작됐다면 stop 시도 — 결과 무시 (cleanup만)
      if (streamIdRef.current !== null && IS_OW && overwolf.streaming) {
        const sid = streamIdRef.current;
        streamIdRef.current = null;
        overwolf.streaming.stop(sid, () => {});
      }
      window._dbgPush('[REC] 카운트다운 취소');
    };
    stopRecordRef.current = () => {
      if (recordStateRef.current !== 'recording') return;
      const durationMs = Math.round(performance.now() - recordStartRef.current);
      const inputs = [...recordInputsRef.current];
      const steps = autoDetectSteps(inputs, durationMs);
      recordIdxRef.current += 1;
      const take = { id: crypto.randomUUID(), idx: recordIdxRef.current, inputs, durationMs, steps };
      setRecordTakes(prev => {
        const next = [...prev, take];
        // 테이크 추가 직후 state.json에 저장
        writeStateFile(next, desktopTokenRef.current);
        return next;
      });
      setSelectedTakeId(take.id);
      setRecordState('idle');
      setShow(prev => ({ ...prev, recordLog: true }));
      setDownloadState(null);
      window._dbgPush(`[REC] 정지 — ${inputs.length}입력 ${(durationMs/1000).toFixed(1)}s`);

      // ── 영상 정지 — overwolf.streaming.stop으로 녹화 종료 ──────────────
      if (IS_OW && streamIdRef.current !== null && overwolf.streaming) {
        const sid = streamIdRef.current;
        streamIdRef.current = null;
        overwolf.streaming.stop(sid, (res) => {
          // 풀 진단: split 발생 여부, last_file_path, duration 확인
          window._dbgPush(`[stream] stop res — split=${res?.split} count=${res?.splitCount} duration=${res?.duration}ms`);
          window._dbgPush(`[stream]   file_path=${res?.file_path}`);
          if (res?.last_file_path && res.last_file_path !== res.file_path) {
            window._dbgPush(`[stream]   ⚠ last_file_path 다름=${res.last_file_path}`);
          }
          if (res && res.success) {
            // 분할되면 last_file_path가 더 최근일 수 있음. 우선 file_path 사용 (보통 첫번째 = 시작부터)
            const path = res.file_path || res.last_file_path || res.url || res.path || res.media_url;
            if (!path) {
              window._dbgPush('[stream] 정지됐지만 파일 경로 없음: ' + JSON.stringify(res).slice(0,300));
              return;
            }
            window._dbgPush('[stream] 정지 OK, 파일=' + path);
            // 즉시 take에 videoFilePath 저장 — handleShare가 fallback으로 직접 read 가능
            setRecordTakes(prev => prev.map(t =>
              t.id === take.id ? { ...t, videoFilePath: path } : t
            ));
            // 비동기로 바이트도 미리 읽어둠 — 성공하면 업로드 더 빠름
            overwolf.io.readBinaryFile(path, {}, ({ success: readOk, content, error }) => {
              if (readOk && content) {
                const videoBytes = new Uint8Array(content);
                setRecordTakes(prev => prev.map(t =>
                  t.id === take.id ? { ...t, videoBytes } : t
                ));
                window._dbgPush(`[stream] video attached to take ${take.id}, ${videoBytes.byteLength} bytes`);
              } else {
                window._dbgPush(`[stream] readBinaryFile 실패 (handleShare에서 재시도): ${error || 'no content'} (path: ${path})`);
              }
            });
          } else {
            window._dbgPush('[stream] 정지 실패: ' + (res?.error || JSON.stringify(res)));
          }
        });
      } else if (IS_OW && streamIdRef.current === null) {
        window._dbgPush('[stream] 활성 stream 없음 — 시작 시 실패했거나 streaming API 미지원');
      }

      // ── Task 9: 게임 상태 스냅샷 요청 → take.gameSnapshot에 비동기 패치 ──
      // background에 'request_snapshot' 메시지 전송 → background가 getInfo() 호출 후
      // 'game_snapshot' 메시지로 회신 → 여기서 받아서 parseLolSnapshot() 후 take 패치
      if (IS_OW) {
        const requestId = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : `snap-${Date.now()}-${Math.random()}`;
        let handled = false;
        const onSnap = (payload) => {
          if (handled) return;
          handled = true;
          const rawSnapshot = payload?.snapshot;
          // 디버그: 실제 OW가 주는 raw 구조 확인 (아이템 등 필드 경로 검증용)
          try {
            const rawStr = JSON.stringify(rawSnapshot).slice(0, 1500);
            window._dbgPush('[snapshot-raw] ' + rawStr);
          } catch(e) {}
          const gameSnapshot = parseLolSnapshot(rawSnapshot);
          window._dbgPush('[snapshot-parsed] level=' + gameSnapshot?.required_level + ' items=' + JSON.stringify(gameSnapshot?.required_items) + ' summoners=' + JSON.stringify(gameSnapshot?.summoner_spells));
          setRecordTakes(prev => {
            const next = prev.map(t =>
              t.id === take.id ? { ...t, gameSnapshot } : t
            );
            // gameSnapshot은 JSON 직렬화 가능 → state.json에 즉시 영속화
            writeStateFile(next, desktopTokenRef.current);
            return next;
          });
          window._dbgPush(`[snapshot] attached to take ${take.id} — ${gameSnapshot ? 'ok' : 'null'}`);
        };
        // 일회성 리스너 (window.OW 버스에 등록 — 후속 take는 자체 리스너로 처리)
        window.OW.onGameSnapshot(onSnap);
        // 응답이 안 오는 경우 30초 후 정리 (handled 플래그로 한 번만 처리)
        setTimeout(() => {
          if (!handled) {
            handled = true;
            window._dbgPush(`[snapshot] timeout for take ${take.id}`);
          }
        }, 30000);
        // background로 요청 전송
        overwolf.windows.obtainDeclaredWindow('background', r => {
          if (r.success) {
            overwolf.windows.sendMessage(r.window.id, 'request_snapshot', { requestId }, () => {});
          } else {
            window._dbgPush('[snapshot] obtainDeclaredWindow background 실패');
          }
        });
      }
    };
    cancelRecordRef.current = () => {
      if (recordStateRef.current !== 'recording') return;
      recordInputsRef.current = [];
      setRecordState('idle');
      // 활성 스트림 있으면 같이 정지 (이전엔 누락돼서 ESC 후 stream이 디스크에 계속 기록되는 버그였음)
      if (IS_OW && streamIdRef.current !== null && overwolf.streaming) {
        const sid = streamIdRef.current;
        streamIdRef.current = null;
        overwolf.streaming.stop(sid, (res) => {
          window._dbgPush('[REC] 취소 + stream 정리: ' + (res?.success ? 'OK' : 'fail'));
        });
      } else {
        window._dbgPush('[REC] 취소');
      }
    };
  }); // no deps

  // 녹화 키 캡처 → masterKeyRef에 통합됨 (OW.onKeyDown 이중 등록 제거)

  const handleDownload = useCallback(() => {
    const take = recordTakes.find(t => t.id === selectedTakeId);
    if (!take || !champion) return;
    const result = window.downloadTutfile({
      title: `${champion.name} 콤보 #${take.idx}`,
      difficulty: 'medium',
      characterId: champion.id,
      characterName: champion.name,
      inputs: take.inputs,
      patch,
    });
    if (result.ok) {
      setDownloadState('저장 완료 — 웹 페이지에서 업로드하세요');
      setTimeout(() => setDownloadState(null), 4000);
    } else {
      setDownloadState(`오류: ${result.error}`);
      setTimeout(() => setDownloadState(null), 4000);
    }
  }, [recordTakes, selectedTakeId, champion, patch]);

  // ── 공유 흐름 (Draft 업로드 → 브라우저 편집) ─────────────────────────────
  // 폼은 게임 입력과 충돌해서 오버레이 안에서 쓸 수 없음. 자동 메타데이터로
  // draft 콤보를 만들고 브라우저로 /combos/[id]/edit 페이지를 열어 거기서 편집한다.
  const handleShare = useCallback(async (take) => {
    window._dbgPush(`[share] handleShare 호출됨 — take=${take?.id?.slice(0,8) || 'null'}`);
    if (!take) return;
    const champ = championRef.current;
    window._dbgPush(`[share] champion=${champ?.name || '없음'} videoBytes=${take.videoBytes?.byteLength || 0}`);

    // Phase 1 — 비디오 바이트 또는 파일 경로 대기 (최대 15초)
    setShareState({ status: 'waiting-video', take });
    const startWait = Date.now();
    let workingTake = take;
    while (Date.now() - startWait < 15000) {
      const fresh = recordTakesRef.current.find(t => t.id === take.id) || take;
      // (1) 이미 메모리에 바이트 있으면 바로 사용
      if (fresh.videoBytes && fresh.videoBytes.byteLength > 0) {
        workingTake = fresh;
        break;
      }
      // (2) 파일 경로는 있지만 비동기 read가 실패/지연 — 직접 읽어보자
      if (fresh.videoFilePath && IS_OW && overwolf.io) {
        window._dbgPush('[share] videoBytes 없음 — videoFilePath로 직접 read 시도');
        const readOk = await new Promise(resolve => {
          overwolf.io.readBinaryFile(fresh.videoFilePath, {}, ({ success, content, error }) => {
            if (success && content) {
              const videoBytes = new Uint8Array(content);
              setRecordTakes(prev => prev.map(t =>
                t.id === fresh.id ? { ...t, videoBytes } : t
              ));
              workingTake = { ...fresh, videoBytes };
              window._dbgPush(`[share] direct read 성공 — ${videoBytes.byteLength} bytes`);
              resolve(true);
            } else {
              window._dbgPush(`[share] direct read 실패: ${error || 'no content'}`);
              resolve(false);
            }
          });
        });
        if (readOk) break;
      }
      // 사용자가 취소(닫기/다른 take 선택)한 경우 중단
      const cur = shareStateRef.current;
      if (!cur || cur.status === 'idle' || cur.take?.id !== take.id) return;
      await new Promise(r => setTimeout(r, 500));
    }

    if (!workingTake.videoBytes || workingTake.videoBytes.byteLength === 0) {
      const fresh = recordTakesRef.current.find(t => t.id === take.id) || take;
      const hint = fresh.videoFilePath
        ? `비디오 읽기 실패 (파일은 있음: ${fresh.videoFilePath.split(/[\\\/]/).pop()}). 다시 시도해보세요.`
        : '비디오 캡처 실패. 다시 녹화해주세요.';
      setShareState({ status: 'error', take, error: hint });
      return;
    }

    window._dbgPush(`[share] Phase 1 통과 — videoBytes ${workingTake.videoBytes?.byteLength || 0} bytes`);

    // Phase 2 — 토큰 확인 (없으면 브라우저로 desktop-login 열고 awaiting-token)
    let token = desktopTokenRef.current;
    window._dbgPush(`[share] Phase 2 — token ${token ? 'OK (' + token.slice(0,12) + '...)' : '없음 → 브라우저 열기'}`);
    if (!token) {
      const loginUrl = 'https://combogg-web.vercel.app/desktop-login';
      if (IS_OW) overwolf.utils.openUrlInDefaultBrowser(loginUrl);
      else window.open(loginUrl, '_blank');
      setShareState({ status: 'awaiting-token', take: workingTake });
      window._dbgPush('[share] awaiting-token 상태로 전환 — desktop-login 페이지에서 토큰 복사 후 붙여넣기 필요');
      return;
    }

    // Phase 3 — 자동 메타데이터로 draft 업로드
    const autoTitle = `${champ?.name || 'LoL'} 콤보 ${new Date().toLocaleString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`;

    try {
      setShareState({ status: 'uploading', take: workingTake, progress: 10 });
      window._dbgPush(`[share] Phase 3 — draft 업로드 시작 (video ${workingTake.videoBytes.byteLength} bytes)`);

      const tutfileBlob = window.buildTutfileBlob({
        title: autoTitle,
        description: '',
        difficulty: 'medium',
        tags: [],
        characterId: champ?.id || 'unknown',
        characterName: champ?.name || '',
        inputs: workingTake.inputs,
        patch,
        take: workingTake,
      });
      // 진단: zip blob에 video.mp4가 정말 들어갔는지 크기로 검증
      // 7-8MB 가까우면 video 포함, 1KB 안팎이면 video 누락
      window._dbgPush(`[share] tutfile blob: ${(tutfileBlob.size / 1024).toFixed(1)} KB (video bytes: ${workingTake.videoBytes.byteLength})`);

      // 1. presigned URL 발급
      setShareState({ status: 'uploading', take: workingTake, progress: 30 });
      const presignedRes = await fetch('https://combogg-web.vercel.app/api/uploads/presigned-url', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({ bucket: 'tutfiles', filename: `${workingTake.id}.tutfile` }),
      });

      if (presignedRes.status === 401) {
        await saveDesktopToken(null);
        setShareState({ status: 'token-expired', take: workingTake });
        return;
      }
      if (!presignedRes.ok) throw new Error(`presigned-url 실패 (HTTP ${presignedRes.status})`);

      const { uploadUrl, path } = await presignedRes.json();

      // 2. .tutfile 업로드 (Supabase Storage)
      setShareState({ status: 'uploading', take: workingTake, progress: 60 });
      const putRes = await fetch(uploadUrl, {
        method: 'PUT',
        body: tutfileBlob,
        headers: { 'Content-Type': 'application/octet-stream' },
      });
      if (!putRes.ok) throw new Error(`스토리지 업로드 실패 (HTTP ${putRes.status})`);

      // 3. 콤보 레코드 생성 (status='draft')
      setShareState({ status: 'uploading', take: workingTake, progress: 85 });
      const comboRes = await fetch('https://combogg-web.vercel.app/api/combos', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({
          tutfilePath: path,
          title: autoTitle,
          gameSlug: 'lol',
          characterSlug: champ?.id || 'unknown',
          difficulty: 'medium',
          tags: [],
          status: 'draft',
          gameSpecific: workingTake.gameSnapshot || {},
        }),
      });

      if (comboRes.status === 401) {
        await saveDesktopToken(null);
        setShareState({ status: 'token-expired', take: workingTake });
        return;
      }
      if (!comboRes.ok) throw new Error(`콤보 생성 실패 (HTTP ${comboRes.status})`);

      const { id: comboId } = await comboRes.json();

      // 4. 브라우저로 편집 페이지 열기
      const editUrl = `https://combogg-web.vercel.app/combos/${comboId}/edit`;
      if (IS_OW) overwolf.utils.openUrlInDefaultBrowser(editUrl);
      else window.open(editUrl, '_blank');

      setShareState({ status: 'done', take: workingTake, comboId, editUrl });
      addDebug(`[Share] draft 업로드 완료: ${comboId} → ${editUrl}`);

    } catch (err) {
      addDebug(`[Share] 오류: ${err?.message || err}`);
      setShareState({
        status: 'error',
        take: workingTake,
        error: err?.message || '알 수 없는 오류',
      });
    }
  }, [patch, saveDesktopToken]);

  // ── 미리보기 핸들러 ───────────────────────────────────────────
  const handlePreview = useCallback((take) => {
    if (!take || take.inputs.length === 0) return;

    // take → 플레이백 엔진이 기대하는 콤보 형상으로 변환
    // normalizeCombo와 동일한 형태: { id, title, difficulty, duration_ms, inputs, steps, game_specific }
    // inputs 배열의 각 항목: { t, key, label }
    const syntheticCombo = {
      id: `preview_${take.id}`,
      title: `미리보기 #${take.idx}`,
      difficulty: 'medium',
      duration_ms: take.durationMs,
      inputs: take.inputs.map(inp => ({
        t: inp.t,
        key: inp.key,
        label: inp.key === 'AA' ? '평타' : inp.key,
      })),
      steps: (take.steps || []).map(s => ({
        start: s.start,
        end: s.end,
        label: s.title || s.label || '',
        title: s.title || s.label || '',
        tip: s.tip || '',
      })),
      game_specific: null,
    };

    addDebug(`[Preview] 테이크 #${take.idx} — ${take.inputs.length}입력 ${(take.durationMs/1000).toFixed(1)}s`);

    // 이미 재생 중이면 먼저 정지
    if (playStateRef.current !== 'idle') {
      cancelAnimationFrame(rafRef.current);
      setPlayState('idle');
    }

    // 미리보기 콤보를 플레이백 엔진에 주입 (activeCombo가 이 값을 우선 사용함)
    setPreviewCombo(syntheticCombo);
    previewComboRef.current = syntheticCombo;

    // activeComboRef도 즉시 갱신 (tick 루프가 바로 참조함)
    activeComboRef.current = syntheticCombo;

    // 루프는 1회로 고정 (미리보기는 한 번만)
    setLoopMode('once');
    loopModeRef.current = 'once';

    // 런 카운터 초기화 후 카운트다운 시작
    runCountRef.current = 0;
    setRunLog([]);

    // 약간의 딜레이 후 카운트다운 시작 (React state 반영 대기)
    setTimeout(() => { startCountdown(); }, 50);
  }, [addDebug]); // eslint-disable-line react-hooks/exhaustive-deps

  // F9(Overwolf 호키) / \(브라우저 개발) = 연습 토글
  // F1/F3/F5/F7/F8/F11/ESC → masterKeyRef(OW inputTracking) 경유 — 인게임 동작
  useEffect(() => {
    OW.onHotkey('start_practice', () => togglePlayRef.current?.());
    const h = e => {
      if (e.key === '\\') { e.preventDefault(); togglePlayRef.current?.(); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  function startCountdown() {
    resetRun();
    setCountNum(3);
    setPlayState('countdown');
    let n = 3;
    const iv = setInterval(() => {
      n--;
      setCountNum(n);
      if (n <= 0) { clearInterval(iv); setPlayState('playing'); }
    }, 1000);
  }

  function onRunComplete(finalMs) {
    const log = {
      runIdx: runCountRef.current + 1,
      inputs: [...curRunInputsRef.current],
      score: scoreRef.current,
      durationMs: Math.round(finalMs),
    };
    runCountRef.current += 1;
    setRunLog(prev => [...prev.slice(-4), log]);

    // 연습 기록 추가 — RecordLogWidget 의 "연습 기록" 섹션에 표시
    setPracticeRuns(prev => [
      { id: crypto.randomUUID(), comboId: activeComboRef.current?.id, comboTitle: activeComboRef.current?.title, score: scoreRef.current, ts: Date.now() },
      ...prev
    ].slice(0, 50));

    const mode = loopModeRef.current;
    const shouldLoop = mode === 'inf'
      || (mode === '3x' && runCountRef.current < 3)
      || (mode === '5x' && runCountRef.current < 5);

    if (shouldLoop) {
      // 짧은 딜레이 후 다음 런 카운트다운
      setTimeout(() => startCountdown(), 600);
    } else {
      setPlayState('idle');
      // 미리보기 중이었으면 종료 시 초기화
      if (previewComboRef.current) {
        setPreviewCombo(null);
        previewComboRef.current = null;
        addDebug('[Preview] 미리보기 완료 — 일반 모드 복귀');
      }
    }
  }

  function resetRun() {
    cancelAnimationFrame(rafRef.current);
    setPlayMs(0); setScore(0); scoreRef.current = 0;
    setMatched(new Set()); matchedRef.current = new Set();
    setLastQuality(null);
    setLiveInputs([]);
    curRunInputsRef.current = [];
    playRef.current = { startTime:null, speed:1, playMs:0 };
  }

  function resetSession() {
    resetRun();
    runCountRef.current = 0;
    setRunLog([]);
  }

  function scoreInput(key, ms) {
    const combo = activeComboRef.current;
    if (!combo) return;
    let bestDt = Infinity, bestIdx = null;
    combo.inputs.forEach((inp, i) => {
      if (matchedRef.current.has(i) || inp.key !== key) return;
      const dt = Math.abs(ms - inp.t);
      if (dt < 900 && dt < bestDt) { bestDt = dt; bestIdx = i; }
    });
    const band = bestIdx !== null ? SCORE_BANDS.find(b => bestDt <= b.w) : null;
    const q = band?.q || 'miss';
    if (bestIdx !== null) {
      const next = new Set([...matchedRef.current, bestIdx]);
      matchedRef.current = next;
      setMatched(next);
      setScore(prev => prev + (band?.pts || 0));
    }
    setLastQuality(q);
    clearTimeout(qualTimer.current);
    qualTimer.current = setTimeout(() => setLastQuality(null), 700);
  }

  const toggleShow = key => setShow(prev => ({ ...prev, [key]: !prev[key] }));

  // 기본 배치 — 뷰포트 % 기반 (해상도·창 크기 자동 대응)
  // unscaled 좌표 = visual_px / scale
  // 챔피언+컨트롤: 시각 x=100 / 시퀀스: 시각 42%vw / 영상: 시각 58%vw
  // 키바인딩: 시각 x=100, y=45%vh (수직 중앙)
  const DEFAULT = React.useMemo(() => {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const u  = v => Math.round(v / widgetScale); // 초기 scale 그대로 사용
    return {
      champion:  { x: u(100),       y: u(20) },
      sequence:  { x: u(vw * 0.32), y: u(20) },
      bindings:  { x: u(vw - 320),  y: u(vh * 0.42) },
      control:   { x: u(100),       y: u(vh * 0.55) }, // LoL HUD(하단 ~vh*0.78~) 위, recordLog(0.28) 아래
      video:     { x: u(vw * 0.55), y: u(20) },
      recordLog: { x: u(100),       y: u(vh * 0.28) }, // 챔피언 아래, 컨트롤(0.62) 위
    };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  return (
    <div style={{ position:'fixed', inset:0, overflow:'hidden', pointerEvents:'none' }}>
      {/* 녹화 카운트다운 — 3-2-1 → REC. 위젯이 다 숨겨진 상태에서 표시 */}
      {recordCountNum !== null && (() => {
        const REC_COLORS = { 3: '#ff6b6b', 2: '#ff4d4d', 1: '#ff2222' };
        const color = recordCountNum > 0 ? (REC_COLORS[recordCountNum] || '#ff4444') : '#ff0000';
        return (
          <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none', zIndex:100 }}>
            <div key={`rec-${recordCountNum}`} style={{ position:'relative', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
              <div style={{
                fontSize: recordCountNum > 0 ? 110 : 100,
                fontWeight: 900, lineHeight: 1, letterSpacing: recordCountNum > 0 ? -4 : 4,
                color, textShadow: `0 0 30px ${color}, 0 0 80px ${color}80`,
                animation: recordCountNum > 0 ? 'countSlam 1s ease forwards' : 'goSlam 0.6s ease forwards',
                willChange: 'transform, opacity',
                position: 'relative', zIndex: 1,
              }}>
                {recordCountNum > 0 ? recordCountNum : '● REC'}
              </div>
              <div style={{ position:'absolute', bottom:-30, color:'rgba(255,255,255,0.6)', fontSize:11, fontFamily:'monospace', whiteSpace:'nowrap' }}>
                {recordCountNum > 0 ? '오버레이 숨김 — 게임 화면만 캡처됨' : ''}
              </div>
            </div>
          </div>
        );
      })()}

      {/* 카운트다운 — 스케일 밖에서 뷰포트 중앙 */}
      {playState === 'countdown' && (() => {
        const COUNT_COLORS = { 3: '#00d4ff', 2: '#ffcc00', 1: '#ff4d4d' };
        const color = countNum > 0 ? (COUNT_COLORS[countNum] || '#ffffff') : '#00ff88';
        return (
          <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none', zIndex:100 }}>
            <div key={countNum} style={{ position:'relative', display:'flex', alignItems:'center', justifyContent:'center' }}>
              {/* Number or GO! */}
              <div style={{
                fontSize: countNum > 0 ? 110 : 130,
                fontWeight: 900,
                lineHeight: 1,
                letterSpacing: countNum > 0 ? -4 : 8,
                color,
                textShadow: `0 0 30px ${color}, 0 0 80px ${color}80`,
                animation: countNum > 0 ? 'countSlam 1s ease forwards' : 'goSlam 0.6s ease forwards',
                willChange: 'transform, opacity',
                position: 'relative',
                zIndex: 1,
              }}>
                {countNum > 0 ? countNum : 'GO!'}
              </div>

            </div>
          </div>
        );
      })()}

      {/* 미리보기 배너 — 미리보기 중에만 표시 */}
      {previewCombo && (playState === 'playing' || playState === 'countdown') && (
        <div style={{
          position:'fixed', top:12, left:'50%', transform:'translateX(-50%)',
          display:'flex', alignItems:'center', gap:10,
          background:'rgba(0,30,10,0.88)',
          border:'1px solid rgba(0,220,100,0.55)',
          borderRadius:20, padding:'5px 16px',
          zIndex:200, pointerEvents:'auto', userSelect:'none',
          boxShadow:'0 0 16px rgba(0,200,80,0.3)',
          animation:'fadeIn 0.2s ease',
        }}>
          <span style={{ width:7, height:7, borderRadius:'50%', background:'#00ff88',
            boxShadow:'0 0 8px #00ff88', flexShrink:0, animation:'pulse 1s infinite' }} />
          <span style={{ fontFamily:'monospace', fontSize:11, fontWeight:700, color:'#00ff88',
            textShadow:'0 0 8px rgba(0,255,130,0.7)', letterSpacing:0.5 }}>
            미리보기 중 — F12로 스텝 마킹 | F9로 중지&nbsp;
            <span style={{ color:'rgba(0,255,136,0.65)', fontWeight:400 }}>
              (스텝: {previewCombo?.steps?.length ?? 0}개)
            </span>
          </span>
        </div>
      )}

      {/* 미니 상태 바 — 항상 표시, 클릭하면 디버그 토글 */}
      <div
        onPointerDown={e => e.stopPropagation()}
        onClick={() => setShowDebug(v => !v)}
        style={{
          position:'fixed', bottom:10, left:'50%', transform:'translateX(-50%)',
          display:'flex', gap:8, alignItems:'center',
          background:'rgba(0,0,0,0.72)', borderRadius:20, padding:'4px 14px',
          border:`1px solid ${showDebug ? 'rgba(255,200,0,0.4)' : 'rgba(255,255,255,0.1)'}`,
          zIndex:998, cursor:'pointer', pointerEvents:'auto', userSelect:'none', whiteSpace:'nowrap',
        }}>
        <span style={{ fontFamily:'monospace', fontSize:10,
          color: champion ? '#00ffaa' : 'rgba(255,255,255,0.35)' }}>
          {champion?.name || '챔피언 대기 중'}
        </span>
        <span style={{ color:'rgba(255,255,255,0.2)' }}>·</span>
        <span style={{ fontFamily:'monospace', fontSize:10,
          color: playerStats ? '#00d4ff' : 'rgba(255,255,255,0.3)' }}>
          API {playerStats ? '✓' : '—'}
        </span>
        <span style={{ color:'rgba(255,255,255,0.2)' }}>·</span>
        <span style={{ fontFamily:'monospace', fontSize:10,
          color: combos.length > 0 ? '#aaa' : 'rgba(255,255,255,0.3)' }}>
          콤보 {combos.length}개
        </span>
        {recordState === 'recording' && <>
          <span style={{ color:'rgba(255,255,255,0.2)' }}>·</span>
          <span style={{ width:6, height:6, borderRadius:'50%', background:'#ff3366',
            boxShadow:'0 0 6px #ff3366', animation:'pulse 1s infinite', flexShrink:0 }} />
          <span style={{ fontFamily:'monospace', fontSize:10, fontWeight:700, color:'#ff3366' }}>
            REC {recordInputsRef.current.length}키
          </span>
        </>}
        {stepFlash && <>
          <span style={{ color:'rgba(255,255,255,0.2)' }}>·</span>
          <span style={{ fontFamily:'monospace', fontSize:10, fontWeight:700, color:'#ffdd00',
            textShadow:'0 0 8px rgba(255,220,0,0.8)' }}>
            ● Step marked
          </span>
        </>}
        <span style={{ color:'rgba(255,255,255,0.2)' }}>·</span>
        <span style={{ fontFamily:'monospace', fontSize:9,
          color: showDebug ? 'rgba(255,200,0,0.8)' : 'rgba(255,255,255,0.3)' }}>
          {showDebug ? '▲DBG' : '▼DBG'}
        </span>
      </div>

      {/* 전체 위젯 스케일 컨테이너 — control center의 +/− 로 조절 */}
      {/* 녹화 카운트다운 중 또는 녹화 중에는 숨김 — past 60초 버퍼에 깨끗한 게임 footage 들어가게 */}
      <div style={{ position:'absolute', inset:0, zoom: widgetScale,
        visibility: (recordCountNum !== null || recordState === 'recording') ? 'hidden' : 'visible' }}>

      {/* 통합: 챔피언 + 콤보 목록 */}
      <Widget defaultPos={DEFAULT.champion} width={240} visible={show.champion} scale={widgetScale}>
        <div className="wh" style={{
          display:'flex', alignItems:'center', gap:12, padding:'12px 16px',
          borderBottom:'1px solid rgba(0,190,255,0.12)',
          background:'linear-gradient(90deg,rgba(0,20,50,0.6),rgba(20,0,50,0.4))',
          cursor:'grab', userSelect:'none',
        }}>
          {/* 챔피언 초상화 */}
          <div style={{ width:44, height:44, borderRadius:7, overflow:'hidden', flexShrink:0,
            border:'2px solid rgba(0,200,255,0.45)', background:'rgba(0,10,30,0.9)',
            display:'flex', alignItems:'center', justifyContent:'center',
            boxShadow:'0 0 12px rgba(0,200,255,0.25)' }}>
            {champion && patch
              ? <img src={`https://ddragon.leagueoflegends.com/cdn/${patch}/img/champion/${champion.name}.png`} width={44} height={44} style={{display:'block',objectFit:'cover'}} onError={e=>e.currentTarget.style.display='none'} />
              : <span style={{fontFamily:'monospace',fontSize:15,color:'rgba(0,200,255,0.45)',fontWeight:900}}>?</span>
            }
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:18, fontWeight:800, lineHeight:1.2, letterSpacing:0.3,
              textShadow: champion ? '0 0 12px rgba(0,200,255,0.45)' : 'none' }}>
              {champion?.name || '—'}
            </div>
            <div style={{ fontSize:12, fontFamily:'monospace', marginTop:3,
              color: champion ? '#00ffaa' : 'rgba(255,255,255,0.3)',
              textShadow: champion ? '0 0 8px rgba(0,255,170,0.5)' : 'none' }}>
              {!champion ? '● 챔피언 감지 대기 중'
                : combos.length > 0 ? `● 콤보 ${combos.length}개 로드됨`
                : '● 등록된 콤보 없음 (웹 확인)'}

            </div>
          </div>
          <span style={{ width:8, height:8, borderRadius:'50%', flexShrink:0,
            background: champion ? '#00ffaa' : 'rgba(255,255,255,0.15)',
            boxShadow: champion ? '0 0 10px #00ffaa, 0 0 20px rgba(0,255,170,0.4)' : 'none' }} />
        </div>
        <ComboQueueWidget combos={combos} activeId={activeId} onSelect={id=>{setActiveId(id);resetSession();}} />
      </Widget>

      {/* 통합: 콤보 시퀀스 + 런 기록 */}
      <Widget defaultPos={DEFAULT.sequence} width={400} visible={show.sequence} scale={widgetScale}>
        <WHeader title="연습" sub={activeCombo?.title} right={
          <span style={{ fontFamily:'monospace', fontSize:11, fontWeight:700, color:DIFF_COLOR[activeCombo?.difficulty]||'#aaa',
            textShadow:`0 0 8px ${DIFF_COLOR[activeCombo?.difficulty]||'#aaa'}` }}>
            {activeCombo?.difficulty?.toUpperCase()}
          </span>
        } />
        <RequirementsWidget gameSpecific={comboDetail?.game_specific ?? activeCombo?.game_specific} playerStats={playerStats} patch={patch} />
        <ComboSequenceWidget
          combo={activeCombo} playMs={playMs} totalMs={TOTAL}
          score={score} lastQuality={lastQuality}
          loopMode={loopMode} runCount={runLog.length}
          playState={playState} liveInputs={liveInputs}
        />
        {runLog.length > 0 && (
          <div style={{ height:1, background:'linear-gradient(90deg,transparent,rgba(0,200,255,0.2),transparent)' }} />
        )}
        <RunHistoryWidget runLog={runLog} playState={playState} />
      </Widget>

      <Widget defaultPos={DEFAULT.bindings} width={260} visible={show.bindings} scale={widgetScale}>
        <WHeader title="키 바인딩" sub="클릭하여 변경" />
        <BindingsWidget bindings={bindings} onChange={setBindings} champData={champData} patch={patch} />
      </Widget>

      <VideoWidget videoUrl={comboDetail?.videoUrl} visible={show.video} defaultPos={DEFAULT.video} scale={widgetScale} />

      <Widget defaultPos={DEFAULT.recordLog} width={260} visible={show.recordLog} scale={widgetScale}>
        <WHeader title="녹화" sub={recordState==='recording'?'● REC':recordTakes.length>0?`${recordTakes.length}개 테이크`:''} />
        <RecordLogWidget
          takes={recordTakes}
          practiceRuns={practiceRuns}
          recordState={recordState}
          onSelectTake={setSelectedTakeId}
          onDeleteTake={id => setRecordTakes(prev => {
            const next = prev.filter(t => t.id !== id);
            // 테이크 삭제 직후 state.json에 저장
            writeStateFile(next, desktopTokenRef.current);
            return next;
          })}
          selectedTakeId={selectedTakeId}
          onDownload={handleDownload}
          downloadState={downloadState}
          onShare={handleShare}
          onPreview={handlePreview}
        />
      </Widget>

      <Widget defaultPos={DEFAULT.control} width={220} scale={widgetScale}>
        <ControlWidget
          show={show} onToggle={toggleShow}
          playState={playState} onPlayToggle={() => togglePlayRef.current?.()}
          loopMode={loopMode} onLoopChange={m=>{setLoopMode(m);runCountRef.current=0;}}
          widgetScale={widgetScale} onScaleChange={setWidgetScale}
          showDebug={showDebug} onToggleDebug={() => setShowDebug(v => !v)}
          recordState={recordState}
          onRecordToggle={() => recordState === 'recording' ? stopRecordRef.current?.() : startRecordRef.current?.()}
          onRecordCancel={() => cancelRecordRef.current?.()}
        />
      </Widget>

      </div>{/* 스케일 컨테이너 끝 */}

      {/* ── 공유 상태 카드 — 스케일 밖, 우상단 ── */}
      <ShareStatus
        shareState={shareState}
        onClose={() => setShareState({ status: 'idle' })}
        onTokenConfirm={async (token) => {
          const trimmed = (token || '').trim();
          if (!trimmed) return;
          await saveDesktopToken(trimmed);
          const pendingTake = shareState.take;
          setShareState({ status: 'idle' });
          if (pendingTake) handleShare(pendingTake);
        }}
        onRetry={() => {
          const pendingTake = shareState.take;
          setShareState({ status: 'idle' });
          if (pendingTake) handleShare(pendingTake);
        }}
      />

      {/* ── 디버그 패널 (우측 중간 기본, 드래그로 이동 가능) ── */}
      {showDebug && recordCountNum === null && recordState !== 'recording' && (
        <DebugPanelDraggable champion={champion} combos={combos} playerStats={playerStats} debugLog={debugLog}>
        <div style={{ fontWeight:700, fontSize:12, marginBottom:6, letterSpacing:2, color:'#ffd700', cursor:'move' }} className="debug-handle">
            ■ DEBUG &nbsp;<span style={{ fontWeight:400, fontSize:10, color:'rgba(255,200,0,0.6)' }}>← 드래그로 이동 / F8로 닫기</span>
          </div>
          <div style={{ marginBottom:4, color:'rgba(255,255,255,0.7)' }}>
            챔피언: <span style={{ color: champion ? '#00ffaa' : '#ff5577' }}>{champion?.name || '없음'}</span>
            &nbsp;|&nbsp; 콤보: <span style={{ color:'#00d4ff' }}>{combos.length}개</span>
            &nbsp;|&nbsp; API: <span style={{ color: playerStats ? '#00ffaa' : '#ff5577' }}>{playerStats ? 'OK' : '대기'}</span>
            &nbsp;|&nbsp; 크기: <span style={{ color:'#00d4ff' }}>{Math.round(widgetScale*100)}%</span>
          </div>
          {playerStats && (
            <div style={{ marginBottom:4, color:'rgba(255,255,255,0.6)', fontSize:10 }}>
              Lv{playerStats.level} | AS {playerStats.attackSpeed?.toFixed(2)} | AH {playerStats.abilityHaste}
            </div>
          )}
          <div style={{ borderTop:'1px solid rgba(255,200,0,0.2)', marginTop:4, paddingTop:4 }}>
            {debugLog.length === 0
              ? <div style={{ color:'rgba(255,255,255,0.3)' }}>이벤트 없음</div>
              : debugLog.map((l, i) => (
                  <div key={i} style={{ color: i===0 ? '#fff' : 'rgba(255,255,255,0.55)', lineHeight:1.6,
                    borderBottom: i < debugLog.length-1 ? '1px solid rgba(255,255,255,0.06)' : 'none' }}>{l}</div>
                ))
            }
          </div>
        </DebugPanelDraggable>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
